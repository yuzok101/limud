<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול והנפקת תעודות מרוכזת - יוזוק מדיק</title>

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Assistant', sans-serif;
  }

  html,
  body {
    min-height: 100%;
  }

  body {
    background: #071522;
    color: #fff;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  button,
  input,
  select {
    font: inherit;
  }

  .app-shell {
    width: 100%;
    min-height: 100vh;
  }

  .admin-panel {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 18px clamp(14px, 2vw, 30px) 24px;
    background: linear-gradient(
      180deg,
      #102d4a 0%,
      #0b2238 100%
    );
    border-radius: 0;
    box-shadow: 0 8px 35px rgba(0,0,0,.38);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 16px;
  }

  h1 {
    color: #ffd700;
    font-weight: 800;
    font-size: clamp(22px,2.2vw,34px);
  }

  .sub-title {
    color: #b8d8ef;
    font-size: 14px;
    margin-top: 3px;
  }

  .top-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4,minmax(0,1fr));
    gap: 10px;
    background: rgba(255,255,255,.045);
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,.09);
  }

  .stats-item {
    padding: 10px 12px;
    border-radius: 9px;
    background: rgba(255,255,255,.04);
    color: #dbeeff;
    text-align: center;
    font-size: 14px;
  }

  .stats-item span {
    display: block;
    font-size: 22px;
    font-weight: 800;
    color: #00c8ff;
  }

  .controls {
    display: grid;
    grid-template-columns:
      minmax(260px,2fr)
      minmax(150px,.8fr)
      auto auto auto auto auto;
    gap: 9px;
    align-items: center;
    margin-bottom: 12px;
  }

  .search-input,
  .select-input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1px solid #167bb0;
    background: #0b2944;
    color: #fff;
    outline: none;
  }

  .search-input:focus,
  .select-input:focus {
    border-color: #00c8ff;
    box-shadow: 0 0 0 2px rgba(0,200,255,.13);
  }

  .select-input option {
    background: #0b2944;
    color: #fff;
  }

  .btn {
    padding: 11px 15px;
    font-size: 14px;
    font-weight: 800;
    border: 0;
    border-radius: 9px;
    cursor: pointer;
    transition: .18s ease;
    white-space: nowrap;
  }

  .btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn-primary {
    background: #00aeea;
    color: #fff;
  }

  .btn-success {
    background: #20a44a;
    color: #fff;
  }

  .btn-warning {
    background: #ff9800;
    color: #fff;
  }

  .btn-secondary {
    background: #64748b;
    color: #fff;
  }

  .btn-danger {
    background: #dc3545;
    color: #fff;
  }

  .btn-dark {
    background: #1e3a56;
    color: #fff;
    border: 1px solid #315675;
  }

  .progress-container {
    display: none;
    margin-bottom: 12px;
    background: rgba(255,255,255,.07);
    border-radius: 9px;
    padding: 9px 12px;
    border: 1px solid rgba(255,255,255,.08);
  }

  .progress-bar-bg {
    background: #071a2a;
    height: 10px;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 6px;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0;
    background: #00c8ff;
    transition: width .2s ease;
  }

  .table-container {
    height: calc(100vh - 300px);
    min-height: 330px;
    overflow: auto;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 10px;
    background: #0b2238;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    text-align: right;
  }

  th,
  td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,.07);
    font-size: 14px;
  }

  th {
    background: #102f4d;
    color: #00c8ff;
    position: sticky;
    top: 0;
    z-index: 2;
  }

  tbody tr:hover {
    background: rgba(0,191,255,.055);
  }

  td:nth-child(1),
  th:nth-child(1) {
    width: 44px;
    text-align: center;
  }

  .course-cell {
    font-weight: 700;
    color: #f5fbff;
  }

  .training-cell {
    color: #bfe7ff;
  }

  .email-ok {
    color: #32d46a;
  }

  .email-no {
    color: #ff6b6b;
  }

  #certificatesContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    margin: 0;
    padding: 28px 12px;
    background: #071522;
  }

  /* =========================================================
     תעודה
     ========================================================= */

  .certificate-container {
    position: relative;
    width: 210mm;
    height: 297mm;
    flex: 0 0 auto;

    background-image: url('certificate-template.jpg');

    background-size: 100.5% 100.5%;
    background-position: center -1.2mm;
    background-repeat: no-repeat;
    background-color: #fff;

    box-sizing: border-box;
    page-break-after: always;
    overflow: hidden;
  }

  /* =========================================================
     שם פרטי + שם משפחה
     ========================================================= */

  .field-name {
    position: absolute;

    top: 34.9%;

    left: 14%;
    right: 14%;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 24px;

    text-align: center;

    font-size: 31px;
    font-weight: 800;

    color: #172c72;

    line-height: 1;

    direction: rtl;

    white-space: nowrap;
  }

  .field-name span {
    display: inline-block;
  }

  /* =========================================================
     מספר תעודת זהות
     ========================================================= */

  .field-id {
    position: absolute;

    top: 46.7%;

    left: 20%;
    right: 20%;

    text-align: left;

    font-size: 22px;
    font-weight: 700;

    color: #1d2d54;

    direction: ltr;

    line-height: 1;

    white-space: nowrap;
  }

  /* =========================================================
     הכשרה
     ========================================================= */

  .field-course {
    position: absolute;

    top: 53.9%;

    left: 16%;
    right: 16%;

    text-align: center;

    font-size: 27px;
    font-weight: 800;

    color: #172c72;

    line-height: 1;

    direction: rtl;

    white-space: nowrap;
  }

  /* =========================================================
     היקף שעות
     ========================================================= */

  .field-hours {
    position: absolute;

    top: 64.5%;

    left: 20%;
    right: 20%;

    text-align: left;

    font-size: 21px;
    font-weight: 700;

    color: #1d2d54;

    direction: rtl;

    line-height: 1;

    white-space: nowrap;
  }

  /* =========================================================
     תאריך הנפקה
     ========================================================= */

  .field-date {
    position: absolute;

    top: 70.2%;

    left: 20%;
    right: 20%;

    text-align: left;

    font-size: 21px;
    font-weight: 700;

    color: #1d2d54;

    direction: ltr;

    line-height: 1;

    white-space: nowrap;
  }

  .certificate-label {
    position: absolute;
    top: 91.8%;
    left: 6%;
    right: 6%;

    text-align: center;

    color: #fff;
    font-size: 10px;
    opacity: .8;
  }

  /* =========================================================
     התאמה למסכים קטנים
     ========================================================= */

  @media (max-width: 1200px) {

    .controls {
      grid-template-columns:
        1fr
        180px
        repeat(3,auto);
    }

    .controls .btn:nth-of-type(4),
    .controls .btn:nth-of-type(5) {
      grid-row: 2;
    }

  }

  @media (max-width: 800px) {

    .admin-panel {
      padding:
        14px
        10px
        18px;
    }

    .stats-bar {
      grid-template-columns:
        repeat(2,1fr);
    }

    .controls {
      grid-template-columns:
        1fr 1fr;
    }

    .controls .search-input {
      grid-column: 1/-1;
    }

    .controls .btn {
      width: 100%;
    }

    .table-container {
      height: 55vh;
    }

    .topbar {
      flex-direction: column;
      align-items: stretch;
    }

    .top-actions {
      justify-content: flex-start;
    }

    /*
      התעודה עצמה נשארת A4.
      בפלאפון מאפשרים גלילה אופקית
      במקום לכווץ את התעודה ולשנות
      את מיקום הטקסט.
    */

    #certificatesContainer {
      align-items: flex-start;
      overflow-x: auto;
      padding: 20px 10px;
    }

    .certificate-container {
      flex-shrink: 0;
    }

  }

  /* =========================================================
     הדפסה
     ========================================================= */

  @media print {

    body {
      background: #fff !important;
      padding: 0 !important;
    }

    .admin-panel {
      display: none !important;
    }

    #certificatesContainer {
      margin: 0 !important;
      padding: 0 !important;
      gap: 0 !important;
    }

    .certificate-container {
      box-shadow: none !important;
      border-radius: 0 !important;
      width: 210mm !important;
      height: 297mm !important;
      page-break-after: always !important;
    }

    @page {
      size: A4 portrait;
      margin: 0 !important;
    }

  }

</style>
</head>

<body>

<div class="app-shell">

  <div class="admin-panel">

    <div class="topbar">

      <div>

        <h1>
          פאנל מנהל — הנפקה וניהול תעודות
        </h1>

        <div class="sub-title">
          ניהול, חיפוש, הנפקה, הורדה ושליחה מרוכזת
        </div>

      </div>

      <div class="top-actions">

        <button
          class="btn btn-dark"
          onclick="loadData()"
        >
          🔄 רענן נתונים
        </button>

        <button
          class="btn btn-dark"
          onclick="clearSelection()"
        >
          ✕ נקה בחירה
        </button>

      </div>

    </div>


    <div class="stats-bar">

      <div class="stats-item">
        סה"כ רשומות
        <span id="statTotal">0</span>
      </div>

      <div class="stats-item">
        רשומות מוצגות
        <span id="statFiltered">0</span>
      </div>

      <div class="stats-item">
        נבחרו
        <span id="statSelected">0</span>
      </div>

      <div class="stats-item">
        עם מייל
        <span id="statWithEmail">0</span>
      </div>

    </div>


    <div class="controls">

      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="חפש לפי ת.ז, שם, קורס, הכשרה או מייל..."
        oninput="filterCertificates()"
      >

      <select
        id="emailFilter"
        class="select-input"
        onchange="filterCertificates()"
      >

        <option value="all">
          כל הרשומות
        </option>

        <option value="hasEmail">
          עם מייל בלבד
        </option>

        <option value="noEmail">
          ללא מייל
        </option>

      </select>


      <button
        class="btn btn-primary"
        onclick="renderSelectedCertificates()"
      >
        👁️ תצוגה
      </button>


      <button
        class="btn btn-warning"
        onclick="downloadSelectedPDFs()"
      >
        ⬇️ הורד PDF
      </button>


      <button
        class="btn btn-warning"
        onclick="downloadSelectedZip()"
      >
        📦 הורד ZIP
      </button>


      <button
        class="btn btn-success"
        onclick="sendSelectedEmails()"
      >
        ✉️ שלח במייל
      </button>


      <button
        class="btn btn-secondary"
        onclick="window.print()"
      >
        🖨️ הדפס
      </button>

    </div>


    <div
      class="progress-container"
      id="progressContainer"
    >

      <div
        id="progressStatusText"
        style="font-size:14px;color:#00c8ff;"
      >
        מעבד...
      </div>

      <div class="progress-bar-bg">

        <div
          id="progressBarFill"
          class="progress-bar-fill"
        ></div>

      </div>

    </div>


    <div class="table-container">

      <table>

        <thead>

          <tr>

            <th>

              <input
                type="checkbox"
                id="selectAll"
                onclick="toggleSelectAll(this)"
                title="בחר הכל"
              >

            </th>

            <th>
              ת.ז
            </th>

            <th>
              שם מלא
            </th>

            <th>
              קורס
            </th>

            <th>
              הכשרה
            </th>

            <th>
              תאריך סיום
            </th>

            <th>
              מייל
            </th>

          </tr>

        </thead>


        <tbody id="certificatesTableBody">

          <tr>

            <td
              colspan="7"
              style="text-align:center;"
            >
              טוען נתונים...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<div id="certificatesContainer"></div>


<script>

  /*
    =========================================================
    GOOGLE APPS SCRIPT
    =========================================================
  */

  const scriptURL =
    'https://script.google.com/macros/s/AKfycbwLkr494xjIbksbfRjaQg7CumbXTaLoln23hWySS5JSO_YrDj5lATNNdPXrcB9aKN17/exec';


  let allCertificates = [];

  let filteredCertificates = [];


  /*
    =========================================================
    טעינת נתונים
    =========================================================
  */

  function loadData() {

    const callbackName =
      'certificatesCallback_' +
      Date.now();


    let finished = false;


    function cleanup() {

      if (finished) {
        return;
      }

      finished = true;


      try {

        delete window[callbackName];

      } catch (e) {}


      const oldScript =
        document.getElementById(
          callbackName
        );


      if (oldScript) {
        oldScript.remove();
      }

    }


    /*
      JSONP callback
    */

    window[callbackName] =
      function(data) {

        try {

          console.log(
            'Google Apps Script response:',
            data
          );


          if (
            !data ||
            !data.success
          ) {

            alert(
              'שגיאה בטעינת הנתונים:\n\n' +
              (
                data &&
                data.message
                  ? data.message
                  : 'Google Apps Script לא החזיר נתונים תקינים'
              )
            );

            return;
          }


          allCertificates =
            Array.isArray(
              data.certificates
            )
              ? data.certificates
              : [];


          filteredCertificates =
            [
              ...allCertificates
            ];


          renderTable();


        } catch (e) {

          console.error(
            'שגיאה בעיבוד הנתונים:',
            e
          );


          alert(
            'שגיאה בעיבוד הנתונים'
          );


        } finally {

          cleanup();

        }

      };


    /*
      יצירת script
    */

    const script =
      document.createElement(
        'script'
      );


    script.id =
      callbackName;


    script.type =
      'text/javascript';


    script.async =
      true;


    script.src =
      scriptURL +
      '?action=getAllCertificates' +
      '&callback=' +
      encodeURIComponent(
        callbackName
      ) +
      '&t=' +
      Date.now();


    /*
      הצלחה בטעינת script
    */

    script.onload =
      function() {

        setTimeout(
          function() {

            if (!finished) {

              console.error(
                'Google Apps Script נטען אך callback לא הופעל'
              );


              cleanup();


              alert(
                'Google Apps Script נטען אך לא החזיר תשובה תקינה.'
              );

            }

          },
          1500
        );

      };


    /*
      שגיאת חיבור
    */

    script.onerror =
      function(event) {

        console.error(
          'Google Apps Script JSONP request failed:',
          event
        );


        cleanup();


        alert(
          'שגיאה בחיבור ל-Google Apps Script.\n\n' +
          'בדוק את הרשאות ה-Web App ואת חיבור האינטרנט.'
        );

      };


    /*
      חשוב:
      מוסיפים ל-head ולא ל-body.
    */

    document.head.appendChild(
      script
    );


    /*
      Timeout
    */

    setTimeout(
      function() {

        if (!finished) {

          console.error(
            'Google Apps Script request timeout'
          );


          cleanup();


          alert(
            'Google Apps Script לא הגיב בזמן.\n\n' +
            'בדוק את חיבור האינטרנט ואת הרשאות ה-Web App.'
          );

        }

      },
      20000
    );

  }


  /*
    =========================================================
    אבטחת HTML
    =========================================================
  */

  function escapeHtml(value) {

    return String(
      value ?? ''
    ).replace(
      /[&<>"']/g,
      function(ch) {

        return {

          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'

        }[ch];

      }
    );

  }


  /*
    =========================================================
    טבלה
    =========================================================
  */

  function renderTable() {

    const tbody =
      document.getElementById(
        'certificatesTableBody'
      );


    if (
      filteredCertificates.length === 0
    ) {

      tbody.innerHTML =
        '<tr>' +
        '<td colspan="7" style="text-align:center;padding:30px;">' +
        'לא נמצאו רשומות מתאימות' +
        '</td>' +
        '</tr>';


      updateStats();


      return;

    }


    tbody.innerHTML =
      filteredCertificates
        .map(
          function(cert,index) {

            return `

              <tr>

                <td>

                  <input
                    type="checkbox"
                    class="cert-checkbox"
                    data-index="${index}"
                    onchange="updateStats()"
                  >

                </td>


                <td dir="ltr">

                  ${escapeHtml(cert.id)}

                </td>


                <td>

                  <strong>

                    ${escapeHtml(cert.firstName)}
                    ${escapeHtml(cert.lastName)}

                  </strong>

                </td>


                <td class="course-cell">

                  ${escapeHtml(
                    cert.courseName || '—'
                  )}

                </td>


                <td class="training-cell">

                  ${escapeHtml(
                    cert.training || '—'
                  )}

                </td>


                <td>

                  ${escapeHtml(
                    cert.courseEnd || '—'
                  )}

                </td>


                <td>

                  ${
                    cert.email

                      ? `

                        <span class="email-ok">

                          ${escapeHtml(cert.email)}

                        </span>

                      `

                      : `

                        <span class="email-no">

                          ללא מייל

                        </span>

                      `
                  }

                </td>

              </tr>

            `;

          }
        )
        .join('');


    document.getElementById(
      'selectAll'
    ).checked = false;


    updateStats();

  }


  /*
    =========================================================
    חיפוש וסינון
    =========================================================
  */

  function filterCertificates() {

    const query =
      document.getElementById(
        'searchInput'
      )
      .value
      .trim()
      .toLowerCase();


    const emailFilter =
      document.getElementById(
        'emailFilter'
      )
      .value;


    filteredCertificates =
      allCertificates.filter(
        function(c) {

          const fullText = [

            c.id,
            c.firstName,
            c.lastName,
            c.training,
            c.courseName,
            c.email

          ]
          .join(' ')
          .toLowerCase();


          const matchesSearch =
            fullText.includes(
              query
            );


          const matchesEmail =
            emailFilter === 'all' ||

            (
              emailFilter === 'hasEmail' &&
              !!c.email
            ) ||

            (
              emailFilter === 'noEmail' &&
              !c.email
            );


          return (
            matchesSearch &&
            matchesEmail
          );

        }
      );


    renderTable();

  }


  /*
    =========================================================
    בחירה
    =========================================================
  */

  function toggleSelectAll(master) {

    document
      .querySelectorAll(
        '.cert-checkbox'
      )
      .forEach(
        function(cb) {

          cb.checked =
            master.checked;

        }
      );


    updateStats();

  }


  function clearSelection() {

    document
      .querySelectorAll(
        '.cert-checkbox'
      )
      .forEach(
        function(cb) {

          cb.checked = false;

        }
      );


    document.getElementById(
      'selectAll'
    ).checked = false;


    updateStats();

  }


  function updateStats() {

    document.getElementById(
      'statTotal'
    ).textContent =
      allCertificates.length;


    document.getElementById(
      'statFiltered'
    ).textContent =
      filteredCertificates.length;


    document.getElementById(
      'statSelected'
    ).textContent =
      document.querySelectorAll(
        '.cert-checkbox:checked'
      ).length;


    document.getElementById(
      'statWithEmail'
    ).textContent =
      allCertificates.filter(
        function(c) {
          return !!c.email;
        }
      ).length;

  }


  /*
    =========================================================
    חישוב שעות
    =========================================================
  */

  function calculateHours(trainingText) {

    const text =
      String(
        trainingText || ""
      ).trim();


    /*
      חובש = 207 שעות
    */

    if (
      /חובש/i.test(text)
    ) {

      return "207 שעות";

    }


    /*
      מע"ר
    */

    if (
      /מע[״"'׳]?ר/.test(text)
    ) {

      const decimal =
        text.match(
          /\d+(?:[.,]\d+)?/
        );


      if (decimal) {

        const n =
          decimal[0].replace(
            ',',
            '.'
          );


        return n === "1"
          ? "שעה"
          : `${n} שעות`;

      }


      return "שעה";

    }


    /*
      כל הכשרה אחרת
    */

    const matched =
      text.match(
        /\d+(?:[.,]\d+)?/
      );


    if (matched) {

      const n =
        matched[0].replace(
          ',',
          '.'
        );


      return n === "1"
        ? "שעה"
        : `${n} שעות`;

    }


    /*
      שעה וחצי
    */

    if (
      /שעה\s*וחצי/.test(text)
    ) {

      return "שעה וחצי";

    }


    return "-- שעות";

  }


  /*
    =========================================================
    תאריך הנפקה
    =========================================================
  */

  function getIssueDate(cert) {

    const raw =

      cert.H ??
      cert.h ??
      cert.columnH ??
      cert.issueDate ??
      cert.dateIssued ??
      cert.issuedDate ??
      cert.courseEnd ??
      "";


    if (!raw) {

      return "";

    }


    const value =
      String(raw).trim();


    /*
      תאריך ישראלי
    */

    if (
      /^\d{1,2}[./-]\d{1,2}[./-]\d{2,4}$/
        .test(value)
    ) {

      return value.replace(
        /-/g,
        "."
      );

    }


    /*
      ISO / Google Sheets
    */

    const d =
      new Date(value);


    if (
      !Number.isNaN(
        d.getTime()
      )
    ) {

      const day =
        String(
          d.getDate()
        ).padStart(
          2,
          "0"
        );


      const month =
        String(
          d.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const year =
        d.getFullYear();


      return `${day}.${month}.${year}`;

    }


    return value;

  }


  /*
    =========================================================
    הכשרה
    =========================================================
  */

  function getCertificateTraining(cert) {

    return cert.training || "";

  }


  /*
    =========================================================
    תעודות נבחרות
    =========================================================
  */

  function getSelectedIndexes() {

    return Array.from(
      document.querySelectorAll(
        '.cert-checkbox:checked'
      )
    )
    .map(
      function(cb) {

        return parseInt(
          cb.getAttribute(
            'data-index'
          )
        );

      }
    );

  }


  /*
    =========================================================
    יצירת תעודה
    =========================================================
  */

  function renderSelectedCertificates() {

    const selectedIndexes =
      getSelectedIndexes();


    if (
      selectedIndexes.length === 0
    ) {

      alert(
        "אנא בחר לפחות תעודה אחת מהרשימה"
      );


      return;

    }


    const container =
      document.getElementById(
        'certificatesContainer'
      );


    container.innerHTML = '';


    selectedIndexes.forEach(
      function(idx) {

        const cert =
          filteredCertificates[idx];


        const hours =
          calculateHours(
            cert.training
          );


        const training =
          getCertificateTraining(
            cert
          );


        const issueDate =
          getIssueDate(
            cert
          );


        const certDiv =
          document.createElement(
            'div'
          );


        certDiv.className =
          'certificate-container';


        certDiv.innerHTML = `

          <div class="field-name">

            <span>
              ${escapeHtml(cert.firstName)}
            </span>

            <span>
              ${escapeHtml(cert.lastName)}
            </span>

          </div>


          <div class="field-id">

            ${escapeHtml(cert.id)}

          </div>


          <div class="field-course">

            ${escapeHtml(training)}

          </div>


          <div class="field-hours">

            ${escapeHtml(hours)}

          </div>


          <div class="field-date">

            ${escapeHtml(issueDate)}

          </div>

        `;


        container.appendChild(
          certDiv
        );

      }
    );


    window.scrollTo({

      top:
        container.offsetTop,

      behavior:
        'smooth'

    });

  }


  /*
    =========================================================
    בניית תעודה ל-PDF
    =========================================================
  */

  function buildCertificateElement(cert) {

    const hours =
      calculateHours(
        cert.training
      );


    const training =
      getCertificateTraining(
        cert
      );


    const issueDate =
      getIssueDate(
        cert
      );


    const certDiv =
      document.createElement(
        'div'
      );


    certDiv.className =
      'certificate-container';


    certDiv.innerHTML = `

      <div class="field-name">

        <span>
          ${escapeHtml(cert.firstName)}
        </span>

        <span>
          ${escapeHtml(cert.lastName)}
        </span>

      </div>


      <div class="field-id">

        ${escapeHtml(cert.id)}

      </div>


      <div class="field-course">

        ${escapeHtml(training)}

      </div>


      <div class="field-hours">

        ${escapeHtml(hours)}

      </div>


      <div class="field-date">

        ${escapeHtml(issueDate)}

      </div>

    `;


    return certDiv;

  }


  /*
    =========================================================
    הגדרות PDF
    =========================================================
  */

  function certificatePdfOptions(cert) {

    return {

      margin: 0,


      filename:
        `תעודה_${cert.firstName}_${cert.lastName}_${cert.id}.pdf`,


      image: {

        type: 'jpeg',

        quality: 0.98

      },


      html2canvas: {

        scale: 2,

        useCORS: true,

        backgroundColor: '#ffffff'

      },


      jsPDF: {

        unit: 'mm',

        format: 'a4',

        orientation: 'portrait'

      },


      pagebreak: {

        mode: [

          'css',

          'legacy'

        ]

      }

    };

  }


  /*
    =========================================================
    הורדת PDF
    =========================================================
  */

  async function downloadSelectedPDFs() {

    const selectedIndexes =
      getSelectedIndexes();


    if (
      !selectedIndexes.length
    ) {

      alert(
        "אנא בחר לפחות תעודה אחת להורדה"
      );


      return;

    }


    showProgress(

      true,

      `מתחיל הורדה של ${selectedIndexes.length} תעודות...`,

      0

    );


    for (
      let i = 0;
      i < selectedIndexes.length;
      i++
    ) {

      const cert =
        filteredCertificates[
          selectedIndexes[i]
        ];


      const elem =
        buildCertificateElement(
          cert
        );


      document
        .getElementById(
          'certificatesContainer'
        )
        .appendChild(
          elem
        );


      await html2pdf()

        .set(
          certificatePdfOptions(
            cert
          )
        )

        .from(elem)

        .save();


      const percent =
        Math.round(
          (
            (i + 1) /
            selectedIndexes.length
          ) * 100
        );


      showProgress(

        true,

        `הורדו ${i + 1} מתוך ${selectedIndexes.length} תעודות`,

        percent

      );


      elem.remove();


      await new Promise(
        function(resolve) {

          setTimeout(
            resolve,
            350
          );

        }
      );

    }


    showProgress(
      false
    );


    alert(
      `ההורדה הסתיימה: ${selectedIndexes.length} תעודות.`
    );

  }


  /*
    =========================================================
    הורדת ZIP
    =========================================================
  */

  async function downloadSelectedZip() {

    const selectedIndexes =
      getSelectedIndexes();


    if (
      !selectedIndexes.length
    ) {

      alert(
        "אנא בחר לפחות תעודה אחת להורדה"
      );


      return;

    }


    if (
      typeof JSZip === 'undefined'
    ) {

      alert(
        "ספריית ZIP לא נטענה. נסה לרענן את הדף."
      );


      return;

    }


    const zip =
      new JSZip();


    showProgress(

      true,

      `מכין ZIP: 0 מתוך ${selectedIndexes.length}`,

      0

    );


    for (
      let i = 0;
      i < selectedIndexes.length;
      i++
    ) {

      const cert =
        filteredCertificates[
          selectedIndexes[i]
        ];


      const elem =
        buildCertificateElement(
          cert
        );


      document
        .getElementById(
          'certificatesContainer'
        )
        .appendChild(
          elem
        );


      const blob =
        await html2pdf()

          .set(
            certificatePdfOptions(
              cert
            )
          )

          .from(elem)

          .outputPdf(
            'blob'
          );


      zip.file(

        `תעודה_${cert.firstName}_${cert.lastName}_${cert.id}.pdf`,

        blob

      );


      elem.remove();


      const percent =
        Math.round(
          (
            (i + 1) /
            selectedIndexes.length
          ) * 100
        );


      showProgress(

        true,

        `מוכן ל-ZIP: ${i + 1} מתוך ${selectedIndexes.length}`,

        percent

      );

    }


    const zipBlob =
      await zip.generateAsync(

        {
          type: 'blob'
        },

        function(meta) {

          showProgress(

            true,

            `דוחס ZIP... ${Math.round(meta.percent)}%`,

            Math.round(meta.percent)

          );

        }

      );


    const url =
      URL.createObjectURL(
        zipBlob
      );


    const a =
      document.createElement(
        'a'
      );


    a.href =
      url;


    a.download =
      `תעודות_יוזוק_מדיק_${new Date().toISOString().slice(0,10)}.zip`;


    document.body.appendChild(
      a
    );


    a.click();


    a.remove();


    URL.revokeObjectURL(
      url
    );


    showProgress(
      false
    );


    alert(
      `ה-ZIP מוכן עם ${selectedIndexes.length} תעודות.`
    );

  }


  /*
    =========================================================
    שליחה מרוכזת למייל
    =========================================================
  */

  async function sendSelectedEmails() {

    const selectedIndexes =
      getSelectedIndexes();


    if (
      !selectedIndexes.length
    ) {

      alert(
        "אנא בחר לפחות תעודה אחת לשליחה"
      );


      return;

    }


    const withEmail =
      selectedIndexes.filter(

        function(idx) {

          return !!filteredCertificates[idx].email;

        }

      );


    if (
      !withEmail.length
    ) {

      alert(
        "לאף אחת מהתעודות שנבחרו אין כתובת מייל."
      );


      return;

    }


    if (
      !confirm(
        `האם לשלוח ${withEmail.length} תעודות במייל?`
      )
    ) {

      return;

    }


    showProgress(

      true,

      `מתחיל בשליחה...`,

      0

    );


    for (
      let i = 0;
      i < selectedIndexes.length;
      i++
    ) {

      const cert =
        filteredCertificates[
          selectedIndexes[i]
        ];


      const percent =
        Math.round(
          (
            (i + 1) /
            selectedIndexes.length
          ) * 100
        );


      if (
        !cert.email
      ) {

        showProgress(

          true,

          `מדלג על ${cert.firstName} ${cert.lastName} — אין מייל`,

          percent

        );


        continue;

      }


      showProgress(

        true,

        `מכין ושולח ל-${cert.firstName} ${cert.lastName} (${i + 1}/${selectedIndexes.length})...`,

        percent

      );


      try {

        const elem =
          buildCertificateElement(
            cert
          );


        document
          .getElementById(
            'certificatesContainer'
          )
          .appendChild(
            elem
          );


        const opt = {

          margin: 0,

          filename:
            `Teuda_${cert.id}.pdf`,

          image: {

            type: 'jpeg',

            quality: 0.95

          },

          html2canvas: {

            scale: 1.5,

            useCORS: true,

            backgroundColor: '#ffffff'

          },

          jsPDF: {

            unit: 'mm',

            format: 'a4',

            orientation: 'portrait'

          }

        };


        const pdfBase64 =
          await html2pdf()

            .set(opt)

            .from(elem)

            .outputPdf(
              'datauristring'
            );


        elem.remove();


        const base64Data =
          pdfBase64.split(',')[1];


        const formData =
          new URLSearchParams();


        formData.append(
          'action',
          'sendBatchEmail'
        );


        formData.append(
          'email',
          cert.email.trim()
        );


        formData.append(

          'fullName',

          `${cert.firstName} ${cert.lastName}`

        );


        formData.append(
          'pdfData',
          base64Data
        );


        formData.append(
          'fileName',
          `Teuda_${cert.id}.pdf`
        );


        await postToAppsScript(
          formData
        );


      } catch (err) {

        console.error(

          `שגיאה בשליחת מייל ל-${cert.email}:`,

          err

        );


        showProgress(

          true,

          `שגיאה בשליחת מייל ל-${cert.firstName} ${cert.lastName}`,

          percent

        );

      }

    }


    showProgress(
      false
    );


    alert(
      "פעולת שליחת המיילים הסתיימה."
    );

  }


  /*
    =========================================================
    POST ל-Google Apps Script
    =========================================================
  */

  function postToAppsScript(formData) {

    return new Promise(

      function(resolve) {

        const iframeName =
          'gasPostFrame_' +
          Date.now();


        const iframe =
          document.createElement(
            'iframe'
          );


        iframe.name =
          iframeName;


        iframe.style.display =
          'none';


        document.body.appendChild(
          iframe
        );


        const form =
          document.createElement(
            'form'
          );


        form.method =
          'POST';


        form.action =
          scriptURL;


        form.target =
          iframeName;


        form.style.display =
          'none';


        for (
          const [key,value]
          of formData.entries()
        ) {

          const input =
            document.createElement(
              'input'
            );


          input.type =
            'hidden';


          input.name =
            key;


          input.value =
            value;


          form.appendChild(
            input
          );

        }


        document.body.appendChild(
          form
        );


        let completed =
          false;


        function finish() {

          if (completed) {
            return;
          }


          completed =
            true;


          if (
            document.body.contains(form)
          ) {

            form.remove();

          }


          if (
            document.body.contains(iframe)
          ) {

            iframe.remove();

          }


          resolve();

        }


        iframe.onload =
          function() {

            setTimeout(
              finish,
              300
            );

          };


        form.submit();


        setTimeout(
          finish,
          15000
        );

      }

    );

  }


  /*
    =========================================================
    פס התקדמות
    =========================================================
  */

  function showProgress(
    show,
    statusText = '',
    percent = 0
  ) {

    const container =
      document.getElementById(
        'progressContainer'
      );


    const textElem =
      document.getElementById(
        'progressStatusText'
      );


    const fillElem =
      document.getElementById(
        'progressBarFill'
      );


    container.style.display =
      show
        ? 'block'
        : 'none';


    textElem.textContent =
      statusText;


    fillElem.style.width =
      percent + '%';

  }


  /*
    =========================================================
    טעינה ראשונית
    =========================================================
  */

  window.addEventListener(
    'load',
    function() {

      loadData();

    }
  );

</script>
