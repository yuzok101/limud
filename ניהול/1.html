<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול והנפקת תעודות מרוכזת - יוזוק מדיק</title>

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Assistant', sans-serif;
}

html, body {
min-height: 100%;
}

body {
background: #071522;
color: #fff;
min-height: 100vh;
padding: 0;
overflow-x: hidden;
}

button, input, select {
font: inherit;
}

.app-shell {
width: 100%;
min-height: 100vh;
}

/* שדרוג עיצוב ה-admin-panel והבאנר העליון */
.admin-panel {
width: 100%;
max-width: none;
margin: 0 auto;
padding: 20px clamp(14px, 2vw, 30px);
background: linear-gradient(180deg, #0f3a59 0%, #082736 100%);
border-radius: 12px;
box-shadow: 0 8px 30px rgba(0,0,0,.45);
}

.topbar {
display: flex;
align-items: center;
justify-content: space-between;
gap: 16px;
margin-bottom: 12px;
padding: 10px;
background: rgba(255,255,255,0.02);
border-radius: 10px;
border: 1px solid rgba(255,255,255,0.03);
}

h1 {
color: #ffd700;
font-weight: 800;
font-size: clamp(20px,2.2vw,28px);
margin: 0;
}

.sub-title {
color: #b8d8ef;
font-size: 13px;
margin-top: 3px;
}

.top-actions {
display: flex;
gap: 8px;
flex-wrap: wrap;
align-items: center;
}

.stats-bar {
display: grid;
grid-template-columns: repeat(4,minmax(0,1fr));
gap: 10px;
background: rgba(255,255,255,.045);
padding: 10px;
border-radius: 12px;
margin-bottom: 12px;
border: 1px solid rgba(255,255,255,.09);
}

.stats-item {
padding: 10px 12px;
border-radius: 9px;
background: rgba(255,255,255,.04);
color: #dbeeff;
text-align: center;
font-size: 14px;
}

.stats-item span {
display: block;
font-size: 22px;
font-weight: 800;
color: #00c8ff;
}

.controls {
display: grid;
grid-template-columns: minmax(260px,2fr) 160px repeat(5,auto);
gap: 10px;
align-items: center;
margin-bottom: 12px;
padding: 12px;
border-radius: 10px;
background: rgba(255,255,255,0.02);
border: 1px solid rgba(255,255,255,0.03);
}

.search-input,
.select-input {
width: 100%;
padding: 11px 14px;
border-radius: 9px;
border: 1px solid #167bb0;
background: #0b2944;
color: #fff;
outline: none;
}

.search-input:focus,
.select-input:focus {
border-color: #00c8ff;
box-shadow: 0 0 0 2px rgba(0,200,255,.13);
}

.select-input option {
background: #0b2944;
color: #fff;
}

.btn {
padding: 10px 14px;
font-size: 13px;
font-weight: 700;
border-radius: 9px;
box-shadow: 0 2px 6px rgba(2,6,23,0.25);
border: 0;
cursor: pointer;
}

.btn-primary { background: #00aeea; color: #fff }
.btn-success { background: #20a44a; color: #fff }
.btn-warning { background: #ff9800; color: #fff }
.btn-secondary { background: #64748b; color: #fff }
.btn-dark { background: #1e3a56; color: #fff; border: 1px solid #315675 }

.progress-container {
display: none;
margin-bottom: 12px;
background: rgba(255,255,255,.07);
border-radius: 9px;
padding: 9px 12px;
border: 1px solid rgba(255,255,255,.08);
}

.progress-bar-bg {
background: #071a2a;
height: 10px;
border-radius: 6px;
overflow: hidden;
margin-top: 6px;
}

.progress-bar-fill {
height: 100%;
width: 0;
background: #00c8ff;
transition: width .2s ease;
}

.table-container {
height: calc(100vh - 300px);
min-height: 330px;
overflow: auto;
border: 1px solid rgba(255,255,255,.10);
border-radius: 10px;
background: #0b2238;
}

table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: right }
th, td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 14px }
th { background: #102f4d; color: #00c8ff; position: sticky; top: 0; z-index: 2 }

tbody tr:hover { background: rgba(0,191,255,.055) }

td:nth-child(1), th:nth-child(1) { width: 44px; text-align: center }

.course-cell { font-weight: 700; color: #f5fbff }
.training-cell { color: #bfe7ff }
.email-ok { color: #32d46a }
.email-no { color: #ff6b6b }

#certificatesContainer { display: flex; flex-direction: column; align-items: center; gap: 24px; margin: 0; padding: 28px 12px; background: #071522 }

/* תעודה - שמרתי את הסגנון המקורי */
.certificate-container { position: relative; width: 210mm; height: 297mm; flex: 0 0 auto; background-image: url('certificate-template.jpg'); background-size: 100.5% 100.5%; background-position: center -1.2mm; background-repeat: no-repeat; background-color: #fff; box-sizing: border-box; page-break-after: always; overflow: hidden }
.field-name { position: absolute; top: 34.9%; left: 14%; right: 14%; display: flex; justify-content: center; align-items: center; gap: 24px; text-align: center; font-size: 31px; font-weight: 800; color: #172c72; line-height: 1; direction: rtl; white-space: nowrap }
.field-name span { display: inline-block }
.field-id { position: absolute; top: 46.7%; left: 20%; right: 20%; text-align: left; font-size: 22px; font-weight: 700; color: #1d2d54; direction: ltr; line-height: 1; white-space: nowrap }
.field-course { position: absolute; top: 53.9%; left: 16%; right: 16%; text-align: center; font-size: 27px; font-weight: 800; color: #172c72; line-height: 1; direction: rtl; white-space: nowrap }
.field-hours { position: absolute; top: 58.3%; left: 20%; right: 20%; text-align: left; font-size: 21px; font-weight: 700; color: #1d2d54; direction: rtl; line-height: 1; white-space: nowrap }
.field-date { position: absolute; top: 63.3%; left: 20%; right: 20%; text-align: left; font-size: 21px; font-weight: 700; color: #1d2d54; direction: ltr; line-height: 1; white-space: nowrap }
.certificate-label { position: absolute; top: 91.8%; left: 6%; right: 6%; text-align: center; color: #fff; font-size: 10px; opacity: .8 }

@media (max-width: 1200px) { .controls { grid-template-columns: 1fr 180px repeat(3,auto) } .controls .btn:nth-of-type(4), .controls .btn:nth-of-type(5) { grid-row: 2 } }
@media (max-width: 800px) { .stats-bar { grid-template-columns: repeat(2,1fr) } .controls { grid-template-columns: 1fr 1fr } .controls .search-input { grid-column: 1/-1 } .table-container { height: 55vh } .topbar { flex-direction: column; align-items: stretch } .top-actions { justify-content: flex-start } }
@media print { body { background: #fff !important; padding: 0 !important } .admin-panel { display: none !important } #certificatesContainer { margin: 0 !important; padding: 0 !important; gap: 0 !important } .certificate-container { box-shadow: none !important; border-radius: 0 !important; width: 210mm !important; height: 297mm !important; page-break-after: always !important } @page { size: A4 portrait; margin: 0 !important } }

/* loading screen */
#loadingScreen{ position:fixed; inset:0; background:#071522; display:flex; align-items:center; justify-content:center; z-index:999999 }
.loading-box{ text-align:center }
.loading-box h1{ color:#ffffff; font-size:42px; margin-top:30px; font-weight:800 }
.loading-box p{ color:#9edcff; font-size:22px; margin-top:12px }
.loader{ width:90px; height:90px; border:8px solid rgba(255,255,255,.15); border-top:8px solid #00c8ff; border-radius:50%; animation:spin 1s linear infinite; margin:auto }
@keyframes spin{ from{ transform:rotate(0deg) } to{ transform:rotate(360deg) } }

#sortField{ min-width:180px }
@media(max-width:900px){ #sortField{ width:100% } }
</style>
</head>

<body>

  <div id="loadingScreen">
    <div class="loading-box">
        <div class="loader"></div>
        <h1>טוען נתונים...</h1>
        <p>אנא המתן</p>
    </div>
</div>

<div class="app-shell" id="appShell" style="display:none;">

<div class="admin-panel">

<div class="topbar">

<div>
<h1>פאנל מנהל — הנפקה וניהול תעודות</h1>
<div class="sub-title">ניהול, חיפוש, הנפקה, הורדה ושליחה מרוכזת</div>
</div>

<div class="top-actions">
<button class="btn btn-dark" onclick="loadData()">🔄 רענן נתונים</button>
<button class="btn btn-dark" onclick="clearSelection()">✕ נקה בחירה</button>
</div>

</div>

<div class="stats-bar">
  <div class="stats-item">סה"כ רשומות<span id="statTotal">0</span></div>
  <div class="stats-item">רשומות מוצגות<span id="statFiltered">0</span></div>
  <div class="stats-item">נבחרו<span id="statSelected">0</span></div>
  <div class="stats-item">עם מייל<span id="statWithEmail">0</span></div>
</div>

<div class="controls">
  <input type="text" id="searchInput" class="search-input" placeholder="חפש לפי ת.ז, שם, קורס, הכשרה או מייל..." oninput="filterCertificates()">

  <select id="emailFilter" class="select-input" onchange="filterCertificates()">
    <option value="all">כל הרשומות</option>
    <option value="hasEmail">עם מייל בלבד</option>
    <option value="noEmail">ללא מייל</option>
  </select>

  <select id="sortField" class="select-input" onchange="sortCertificates()">
    <option value="">ללא מיון</option>
    <option value="id">מיין לפי ת.ז</option>
    <option value="firstName">מיין לפי שם</option>
    <option value="lastName">מיין לפי שם משפחה</option>
    <option value="courseName">מיין לפי קורס</option>
    <option value="training">מיין לפי הכשרה</option>
  </select>

  <button class="btn btn-primary" onclick="renderSelectedCertificates()">👁️ תצוגה</button>
  <button class="btn btn-warning" onclick="downloadSelectedPDFs()">⬇️ הורד PDF</button>
  <button class="btn btn-warning" onclick="downloadSelectedZip()">📦 הורד ZIP</button>
  <button class="btn btn-success" onclick="sendSelectedEmails()">✉️ שלח למיילים</button>
  <button class="btn btn-success" onclick="sendCertificatesToCustomEmail()">📧 שלח למייל שאבחר</button>
  <button class="btn btn-secondary" onclick="window.print()">🖨️ הדפס</button>
</div>

<div class="progress-container" id="progressContainer">
  <div id="progressStatusText" style="font-size:14px;color:#00c8ff;">מעבד...</div>
  <div class="progress-bar-bg"><div id="progressBarFill" class="progress-bar-fill"></div></div>
</div>

<div class="table-container">
<table>
<thead>
<tr>
<th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" title="בחר הכל"></th>
<th>ת.ז</th>
<th>שם מלא</th>
<th>קורס</th>
<th>הכשרה</th>
<th>תאריך סיום</th>
<th>מייל</th>
</tr>
</thead>
<tbody id="certificatesTableBody">
<tr><td colspan="7" style="text-align:center;padding:30px;">טוען נתונים...</td></tr>
</tbody>
</table>
</div>

</div>

</div>

<div id="certificatesContainer"></div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbwLkr494xjIbksbfRjaQg7CumbXTaLoln23hWySS5JSO_YrDj5lATNNdPXrcB9aKN17/exec';
let allCertificates = [];
let filteredCertificates = [];
let selectedIds = new Set();

function loadData() {
  const callbackName = 'certificatesCallback_' + Date.now();

  window[callbackName] = function(data) {
    try {
      try { console.log('Google Apps Script response:', JSON.stringify(data, null, 2)); } catch(e){ console.log('Google Apps Script response (non-serializable):', data); }

      if (!data || !data.success) {
        alert('שגיאה בטעינת הנתונים: ' + (data && data.message ? data.message : 'שגיאה לא ידועה'));
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('appShell').style.display = 'block';
        return;
      }

      allCertificates = Array.isArray(data.certificates) ? data.certificates : [];
      filteredCertificates = [...allCertificates];
      // ensure fields exist
      filteredCertificates.forEach(item=>{ item.id = item.id ?? item.tz ?? ''; item.firstName = item.firstName ?? item.first ?? ''; item.lastName = item.lastName ?? item.lastName ?? item.surname ?? ''; item.courseName = item.courseName ?? item.course ?? ''; item.training = item.training ?? ''; item.email = item.email ?? item.mail ?? ''; });

      sortCertificates();
      renderTable();
      updateStats();
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('appShell').style.display = 'block';
    } catch (e) {
      console.error('שגיאה בעיבוד הנתונים:', e);
      alert('שגיאה בעיבוד הנתונים');
    } finally {
      delete window[callbackName];
      const oldScript = document.getElementById(callbackName);
      if (oldScript) oldScript.remove();
    }
  };

  const script = document.createElement('script');
  script.id = callbackName;
  script.src = scriptURL + '?action=getAllCertificates' + '&callback=' + encodeURIComponent(callbackName) + '&t=' + Date.now();
  script.onerror = function(){ console.error('Google Apps Script JSONP request failed'); alert('שגיאה בחיבור ל-Google Apps Script'); delete window[callbackName]; script.remove(); };
  document.body.appendChild(script);
}

function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }

function sortCertificates() {
  const field = document.getElementById('sortField').value;
  if (!field) { renderTable(); return; }
  filteredCertificates.sort((a,b)=>{
    let va = a[field] ?? '';
    let vb = b[field] ?? '';
    if (field === 'id') {
      const na = Number(String(va).replace(/\D/g,'')) || 0;
      const nb = Number(String(vb).replace(/\D/g,'')) || 0;
      return na - nb;
    }
    va = String(va).trim().toLowerCase(); vb = String(vb).trim().toLowerCase();
    return va.localeCompare(vb, 'he', { sensitivity: 'base' });
  });
  renderTable();
}

function filterCertificates() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const emailFilter = document.getElementById('emailFilter').value;
  filteredCertificates = allCertificates.filter(item => {
    const hay = ((item.id ?? '') + ' ' + (item.firstName ?? '') + ' ' + (item.lastName ?? '') + ' ' + (item.courseName ?? '') + ' ' + (item.training ?? '') + ' ' + (item.email ?? '')).toString().toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (emailFilter === 'hasEmail') return Boolean(item.email && String(item.email).trim().length > 0);
    if (emailFilter === 'noEmail') return !(item.email && String(item.email).trim().length > 0);
    return true;
  });
  sortCertificates();
  updateStats();
}

function renderTable() {
  const tbody = document.getElementById('certificatesTableBody');
  if (filteredCertificates.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;">לא נמצאו רשומות מתאימות</td></tr>';
    return;
  }
  const rows = filteredCertificates.map(item=>{
    const id = escapeHtml(item.id || '');
    const name = escapeHtml(((item.firstName||'') + ' ' + (item.lastName||'')).trim());
    const course = escapeHtml(item.courseName || '');
    const training = escapeHtml(item.training || '');
    const date = escapeHtml(item.endDate || item.date || '');
    const email = escapeHtml(item.email || '');
    const checked = selectedIds.has(item.id) ? 'checked' : '';
    return `<tr data-id="${id}">`+
      `<td style="text-align:center;"><input type="checkbox" class="rowCheckbox" data-id="${id}" ${checked} onclick="onRowToggle(event,this)" /></td>`+
      `<td>${id}</td>`+
      `<td class="course-cell">${name}</td>`+
      `<td>${course}</td>`+
      `<td class="training-cell">${training}</td>`+
      `<td>${date}</td>`+
      `<td>${email ? '<span class="email-ok">'+email+'</span>' : '<span class="email-no">(אין מייל)</span>'}</td>`+
    `</tr>`;
  }).join('');
  tbody.innerHTML = rows;
  updateStats();
}

function updateStats(){
  document.getElementById('statTotal').textContent = allCertificates.length;
  document.getElementById('statFiltered').textContent = filteredCertificates.length;
  document.getElementById('statSelected').textContent = selectedIds.size;
  const withEmail = allCertificates.filter(i=>i.email && String(i.email).trim()).length;
  document.getElementById('statWithEmail').textContent = withEmail;
}

function toggleSelectAll(chk){
  const boxes = document.querySelectorAll('.rowCheckbox');
  boxes.forEach(b=>{
    b.checked = chk.checked;
    const id = b.getAttribute('data-id');
    if (chk.checked) selectedIds.add(id); else selectedIds.delete(id);
  });
  updateStats();
}

function onRowToggle(e, el){
  const id = el.getAttribute('data-id');
  if (el.checked) selectedIds.add(id); else selectedIds.delete(id);
  updateStats();
}

function clearSelection(){ selectedIds.clear(); document.querySelectorAll('.rowCheckbox').forEach(b=>b.checked=false); updateStats(); }

// stubs for actions - you can expand these later
function renderSelectedCertificates(){ alert('תצוגה נפתחת עבור ' + selectedIds.size + ' פריטים'); }
function downloadSelectedPDFs(){ alert('הורדת PDF עבור ' + selectedIds.size + ' פריטים'); }
function downloadSelectedZip(){ alert('הורדת ZIP עבור ' + selectedIds.size + ' פריטים'); }
function sendSelectedEmails(){ alert('שליחת מיילים עבור ' + selectedIds.size + ' פריטים'); }
function sendCertificatesToCustomEmail(){ const email = prompt('הכנס כתובת מייל לשליחה'); if(email) alert('ישלח ל:' + email + ' (' + selectedIds.size + ' פריטים)'); }

// initialize
document.addEventListener('DOMContentLoaded', ()=>{
  loadData();
});
</script>

</body>
</html>
