<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול והנפקת תעודות מרוכזת - יוזוק מדיק</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; }
  html, body { min-height: 100%; }
  body {
    background: #071522;
    color: #fff;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }
  button, input, select { font: inherit; }

  .app-shell { width: 100%; min-height: 100vh; }
  .admin-panel {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 18px clamp(14px, 2vw, 30px) 24px;
    background: linear-gradient(180deg, #102d4a 0%, #0b2238 100%);
    border-radius: 0;
    box-shadow: 0 8px 35px rgba(0,0,0,.38);
  }

  .topbar {
    display:flex; align-items:center; justify-content:space-between; gap:15px;
    margin-bottom:16px;
  }
  h1 { color:#ffd700; font-weight:800; font-size:clamp(22px,2.2vw,34px); }
  .sub-title { color:#b8d8ef; font-size:14px; margin-top:3px; }
  .top-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

  .stats-bar {
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px;
    background:rgba(255,255,255,.045); padding:10px; border-radius:12px;
    margin-bottom:12px; border:1px solid rgba(255,255,255,.09);
  }
  .stats-item {
    padding:10px 12px; border-radius:9px; background:rgba(255,255,255,.04);
    color:#dbeeff; text-align:center; font-size:14px;
  }
  .stats-item span { display:block; font-size:22px; font-weight:800; color:#00c8ff; }

  .controls {
    display:grid; grid-template-columns:minmax(260px,2fr) minmax(150px,.8fr) auto auto auto auto auto;
    gap:9px; align-items:center; margin-bottom:12px;
  }
  .search-input, .select-input {
    width:100%; padding:11px 14px; border-radius:9px;
    border:1px solid #167bb0; background:#0b2944; color:#fff; outline:none;
  }
  .search-input:focus, .select-input:focus { border-color:#00c8ff; box-shadow:0 0 0 2px rgba(0,200,255,.13); }
  .select-input option { background:#0b2944; color:#fff; }

  .btn {
    padding:11px 15px; font-size:14px; font-weight:800; border:0; border-radius:9px;
    cursor:pointer; transition:.18s ease; white-space:nowrap;
  }
  .btn:hover { transform:translateY(-1px); filter:brightness(1.08); }
  .btn:active { transform:translateY(0); }
  .btn-primary { background:#00aeea; color:#fff; }
  .btn-success { background:#20a44a; color:#fff; }
  .btn-warning { background:#ff9800; color:#fff; }
  .btn-secondary { background:#64748b; color:#fff; }
  .btn-danger { background:#dc3545; color:#fff; }
  .btn-dark { background:#1e3a56; color:#fff; border:1px solid #315675; }

  .progress-container {
    display:none; margin-bottom:12px; background:rgba(255,255,255,.07);
    border-radius:9px; padding:9px 12px; border:1px solid rgba(255,255,255,.08);
  }
  .progress-bar-bg { background:#071a2a; height:10px; border-radius:6px; overflow:hidden; margin-top:6px; }
  .progress-bar-fill { height:100%; width:0; background:#00c8ff; transition:width .2s ease; }

  .table-container {
    height:calc(100vh - 300px); min-height:330px; overflow:auto;
    border:1px solid rgba(255,255,255,.10); border-radius:10px;
    background:#0b2238;
  }
  table { width:100%; border-collapse:separate; border-spacing:0; text-align:right; }
  th, td { padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.07); font-size:14px; }
  th { background:#102f4d; color:#00c8ff; position:sticky; top:0; z-index:2; }
  tbody tr:hover { background:rgba(0,191,255,.055); }
  td:nth-child(1), th:nth-child(1) { width:44px; text-align:center; }
  .course-cell { font-weight:700; color:#f5fbff; }
  .training-cell { color:#bfe7ff; }
  .email-ok { color:#32d46a; }
  .email-no { color:#ff6b6b; }

  #certificatesContainer {
    display:flex; flex-direction:column; align-items:center; gap:24px;
    margin:0; padding:28px 12px; background:#071522;
  }

  .certificate-container {
    position:relative; width:210mm; height:297mm; flex:0 0 auto;
    background-image:url('certificate-template.jpg');
    background-size:100% 100%; background-position:center; background-repeat:no-repeat;
    background-color:#fff; box-sizing:border-box; page-break-after:always;
    overflow:hidden;
  }

  /* טקסט שמונח מעל התמונה */
  .field-name {
    position:absolute; top:48.0%; left:18%; right:18%;
    text-align:center; font-size:31px; font-weight:800; color:#172c72;
    line-height:1.05; direction:rtl;
  }
  .field-id {
    position:absolute; top:63.5%; left:26%; right:19%;
    text-align:center; font-size:22px; font-weight:700; color:#1d2d54;
    direction:ltr; line-height:1;
  }
  .field-course {
    position:absolute; top:74.0%; left:16%; right:16%;
    text-align:center; font-size:26px; font-weight:800; color:#172c72;
    line-height:1.05; direction:rtl;
  }
  .field-hours {
    position:absolute; top:84.0%; left:31%; right:15%;
    text-align:center; font-size:21px; font-weight:700; color:#1d2d54;
    direction:rtl; line-height:1;
  }
  .field-date {
    position:absolute; top:88.8%; left:31%; right:15%;
    text-align:center; font-size:21px; font-weight:700; color:#1d2d54;
    direction:ltr; line-height:1;
  }

  .certificate-label {
    position:absolute; top:91.8%; left:6%; right:6%; text-align:center;
    color:#fff; font-size:10px; opacity:.8;
  }

  @media (max-width: 1200px) {
    .controls { grid-template-columns:1fr 180px repeat(3,auto); }
    .controls .btn:nth-of-type(4), .controls .btn:nth-of-type(5) { grid-row:2; }
  }
  @media (max-width: 800px) {
    .stats-bar { grid-template-columns:repeat(2,1fr); }
    .controls { grid-template-columns:1fr 1fr; }
    .controls .search-input { grid-column:1/-1; }
    .table-container { height:55vh; }
    .topbar { flex-direction:column; align-items:stretch; }
    .top-actions { justify-content:flex-start; }
  }

  @media print {
    body { background:#fff !important; padding:0 !important; }
    .admin-panel { display:none !important; }
    #certificatesContainer { margin:0 !important; padding:0 !important; gap:0 !important; }
    .certificate-container {
      box-shadow:none !important; border-radius:0 !important;
      width:210mm !important; height:297mm !important; page-break-after:always !important;
    }
    @page { size:A4 portrait; margin:0 !important; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="admin-panel">
    <div class="topbar">
      <div>
        <h1>פאנל מנהל — הנפקה וניהול תעודות</h1>
        <div class="sub-title">ניהול, חיפוש, הנפקה, הורדה ושליחה מרוכזת</div>
      </div>
      <div class="top-actions">
        <button class="btn btn-dark" onclick="loadData()">🔄 רענן נתונים</button>
        <button class="btn btn-dark" onclick="clearSelection()">✕ נקה בחירה</button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stats-item">סה"כ רשומות <span id="statTotal">0</span></div>
      <div class="stats-item">רשומות מוצגות <span id="statFiltered">0</span></div>
      <div class="stats-item">נבחרו <span id="statSelected">0</span></div>
      <div class="stats-item">עם מייל <span id="statWithEmail">0</span></div>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input"
             placeholder="חפש לפי ת.ז, שם, קורס, הכשרה או מייל..."
             oninput="filterCertificates()">

      <select id="emailFilter" class="select-input" onchange="filterCertificates()">
        <option value="all">כל הרשומות</option>
        <option value="hasEmail">עם מייל בלבד</option>
        <option value="noEmail">ללא מייל</option>
      </select>

      <button class="btn btn-primary" onclick="renderSelectedCertificates()">👁️ תצוגה</button>
      <button class="btn btn-warning" onclick="downloadSelectedPDFs()">⬇️ הורד PDF</button>
      <button class="btn btn-warning" onclick="downloadSelectedZip()">📦 הורד ZIP</button>
      <button class="btn btn-success" onclick="sendSelectedEmails()">✉️ שלח במייל</button>
      <button class="btn btn-secondary" onclick="window.print()">🖨️ הדפס</button>
    </div>

    <div class="progress-container" id="progressContainer">
      <div id="progressStatusText" style="font-size:14px;color:#00c8ff;">מעבד...</div>
      <div class="progress-bar-bg"><div id="progressBarFill" class="progress-bar-fill"></div></div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" title="בחר הכל"></th>
            <th>ת.ז</th>
            <th>שם מלא</th>
            <th>קורס</th>
            <th>הכשרה</th>
            <th>תאריך סיום</th>
            <th>מייל</th>
          </tr>
        </thead>
        <tbody id="certificatesTableBody">
          <tr><td colspan="7" style="text-align:center;">טוען נתונים...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="certificatesContainer"></div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwLkr494xjIbksbfRjaQg7CumbXTaLoln23hWySS5JSO_YrDj5lATNNdPXrcB9aKN17/exec';
  
  let allCertificates = [];
  let filteredCertificates = [];

  // טעינת נתונים - JSONP כדי לעקוף CORS של Google Apps Script
  function loadData() {
    const callbackName = 'certificatesCallback_' + Date.now();

    window[callbackName] = function(data) {
      try {
        console.log('Google Apps Script response:', data);

        if (!data || !data.success) {
          alert('שגיאה בטעינת הנתונים: ' + (
            data && data.message ? data.message : 'שגיאה לא ידועה'
          ));
          return;
        }

        allCertificates = Array.isArray(data.certificates)
          ? data.certificates
          : [];

        filteredCertificates = [...allCertificates];
        renderTable();

      } catch (e) {
        console.error('שגיאה בעיבוד הנתונים:', e);
        alert('שגיאה בעיבוד הנתונים');
      } finally {
        delete window[callbackName];
        const oldScript = document.getElementById(callbackName);
        if (oldScript) oldScript.remove();
      }
    };

    const script = document.createElement('script');
    script.id = callbackName;
    script.src =
      scriptURL +
      '?action=getAllCertificates' +
      '&callback=' + encodeURIComponent(callbackName) +
      '&t=' + Date.now();

    script.onerror = function() {
      console.error('Google Apps Script JSONP request failed');
      alert('שגיאה בחיבור ל-Google Apps Script');
      delete window[callbackName];
      script.remove();
    };

    document.body.appendChild(script);
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
    }[ch]));
  }

  function renderTable() {
    const tbody = document.getElementById('certificatesTableBody');

    if (filteredCertificates.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;">לא נמצאו רשומות מתאימות</td></tr>';
      updateStats();
      return;
    }

    tbody.innerHTML = filteredCertificates.map((cert, index) => `
      <tr>
        <td><input type="checkbox" class="cert-checkbox" data-index="${index}" onchange="updateStats()"></td>
        <td dir="ltr">${escapeHtml(cert.id)}</td>
        <td><strong>${escapeHtml(cert.firstName)} ${escapeHtml(cert.lastName)}</strong></td>
        <td class="course-cell">${escapeHtml(cert.courseName || '—')}</td>
        <td class="training-cell">${escapeHtml(cert.training || '—')}</td>
        <td>${escapeHtml(cert.courseEnd || '—')}</td>
        <td>${cert.email
          ? `<span class="email-ok">${escapeHtml(cert.email)}</span>`
          : '<span class="email-no">ללא מייל</span>'}</td>
      </tr>
    `).join('');

    document.getElementById('selectAll').checked = false;
    updateStats();
  }

  function filterCertificates() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const emailFilter = document.getElementById('emailFilter').value;

    filteredCertificates = allCertificates.filter(c => {
      const fullText = [
        c.id, c.firstName, c.lastName, c.training, c.courseName, c.email
      ].join(' ').toLowerCase();

      const matchesSearch = fullText.includes(query);
      const matchesEmail =
        emailFilter === 'all' ||
        (emailFilter === 'hasEmail' && !!c.email) ||
        (emailFilter === 'noEmail' && !c.email);

      return matchesSearch && matchesEmail;
    });

    renderTable();
  }

  function toggleSelectAll(master) {
    document.querySelectorAll('.cert-checkbox').forEach(cb => {
      cb.checked = master.checked;
    });
    updateStats();
  }

  function clearSelection() {
    document.querySelectorAll('.cert-checkbox').forEach(cb => cb.checked = false);
    document.getElementById('selectAll').checked = false;
    updateStats();
  }

  function updateStats() {
    document.getElementById('statTotal').textContent = allCertificates.length;
    document.getElementById('statFiltered').textContent = filteredCertificates.length;
    document.getElementById('statSelected').textContent =
      document.querySelectorAll('.cert-checkbox:checked').length;
    document.getElementById('statWithEmail').textContent =
      allCertificates.filter(c => !!c.email).length;
  }


  function calculateHours(trainingText) {
    const text = (trainingText || "").trim();
    if (text.includes('מע"ר 44')) return "44 שעות";
    if (text.includes('מע"ר 60')) return "60 שעות";
    if (text.includes('חובש')) return "207 שעות";
    const matched = text.match(/\d+/);
    return matched ? matched[0] + " שעות" : "-- שעות";
  }

  function getSelectedIndexes() {
    return Array.from(document.querySelectorAll('.cert-checkbox:checked'))
      .map(cb => parseInt(cb.getAttribute('data-index')));
  }

  // יצירת תצוגת תעודות מהתמונה שהועלתה
  function renderSelectedCertificates() {
    const selectedIndexes = getSelectedIndexes();

    if (selectedIndexes.length === 0) {
      alert("אנא בחר לפחות תעודה אחת מהרשימה");
      return;
    }

    const container = document.getElementById('certificatesContainer');
    container.innerHTML = '';

    selectedIndexes.forEach(idx => {
      const cert = filteredCertificates[idx];
      const hours = calculateHours(cert.training);

      const certDiv = document.createElement('div');
      certDiv.className = 'certificate-container';
      certDiv.innerHTML = `
        <div class="field-name">${escapeHtml(cert.firstName)} ${escapeHtml(cert.lastName)}</div>
        <div class="field-id">${escapeHtml(cert.id)}</div>
        <div class="field-course">${escapeHtml(cert.courseName || cert.training || '')}</div>
        <div class="field-hours">${escapeHtml(hours)}</div>
        <div class="field-date">${escapeHtml(cert.courseEnd)}</div>
      `;
      container.appendChild(certDiv);
    });

    window.scrollTo({ top: container.offsetTop, behavior: 'smooth' });
  }

  function buildCertificateElement(cert) {
    const hours = calculateHours(cert.training);
    const certDiv = document.createElement('div');
    certDiv.className = 'certificate-container';
    certDiv.innerHTML = `
      <div class="field-name">${escapeHtml(cert.firstName)} ${escapeHtml(cert.lastName)}</div>
      <div class="field-id">${escapeHtml(cert.id)}</div>
      <div class="field-course">${escapeHtml(cert.courseName || cert.training || '')}</div>
      <div class="field-hours">${escapeHtml(hours)}</div>
      <div class="field-date">${escapeHtml(cert.courseEnd)}</div>
    `;
    return certDiv;
  }

  function certificatePdfOptions(cert) {
    return {
      margin: 0,
      filename: `תעודה_${cert.firstName}_${cert.lastName}_${cert.id}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] }
    };
  }

  // הורדת כל תעודה כ-PDF נפרד, אחת אחרי השנייה
  async function downloadSelectedPDFs() {
    const selectedIndexes = getSelectedIndexes();
    if (!selectedIndexes.length) {
      alert("אנא בחר לפחות תעודה אחת להורדה");
      return;
    }

    showProgress(true, `מתחיל הורדה של ${selectedIndexes.length} תעודות...`, 0);

    for (let i = 0; i < selectedIndexes.length; i++) {
      const cert = filteredCertificates[selectedIndexes[i]];
      const elem = buildCertificateElement(cert);
      document.getElementById('certificatesContainer').appendChild(elem);

      await html2pdf().set(certificatePdfOptions(cert)).from(elem).save();

      const percent = Math.round(((i + 1) / selectedIndexes.length) * 100);
      showProgress(true, `הורדו ${i + 1} מתוך ${selectedIndexes.length} תעודות`, percent);

      elem.remove();
      await new Promise(r => setTimeout(r, 350));
    }

    showProgress(false);
    alert(`ההורדה הסתיימה: ${selectedIndexes.length} תעודות.`);
  }

  // אפשרות יציבה יותר: קובץ ZIP אחד עם כל התעודות
  async function downloadSelectedZip() {
    const selectedIndexes = getSelectedIndexes();
    if (!selectedIndexes.length) {
      alert("אנא בחר לפחות תעודה אחת להורדה");
      return;
    }

    if (typeof JSZip === 'undefined') {
      alert("ספריית ZIP לא נטענה. נסה לרענן את הדף.");
      return;
    }

    const zip = new JSZip();
    showProgress(true, `מכין ZIP: 0 מתוך ${selectedIndexes.length}`, 0);

    for (let i = 0; i < selectedIndexes.length; i++) {
      const cert = filteredCertificates[selectedIndexes[i]];
      const elem = buildCertificateElement(cert);
      document.getElementById('certificatesContainer').appendChild(elem);

      const blob = await html2pdf()
        .set(certificatePdfOptions(cert))
        .from(elem)
        .outputPdf('blob');

      zip.file(`תעודה_${cert.firstName}_${cert.lastName}_${cert.id}.pdf`, blob);
      elem.remove();

      const percent = Math.round(((i + 1) / selectedIndexes.length) * 100);
      showProgress(true, `מוכן ל-ZIP: ${i + 1} מתוך ${selectedIndexes.length}`, percent);
    }

    const zipBlob = await zip.generateAsync({ type: 'blob' }, meta => {
      showProgress(true, `דוחס ZIP... ${Math.round(meta.percent)}%`, Math.round(meta.percent));
    });

    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `תעודות_יוזוק_מדיק_${new Date().toISOString().slice(0,10)}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    showProgress(false);
    alert(`ה-ZIP מוכן עם ${selectedIndexes.length} תעודות.`);
  }

  // שליחה מרוכזת למייל
  async function sendSelectedEmails() {
    const selectedIndexes = getSelectedIndexes();

    if (!selectedIndexes.length) {
      alert("אנא בחר לפחות תעודה אחת לשליחה");
      return;
    }

    const withEmail = selectedIndexes.filter(idx => !!filteredCertificates[idx].email);
    if (!withEmail.length) {
      alert("לאף אחת מהתעודות שנבחרו אין כתובת מייל.");
      return;
    }

    if (!confirm(`האם לשלוח ${withEmail.length} תעודות במייל?`)) return;

    showProgress(true, `מתחיל בשליחה...`, 0);

    for (let i = 0; i < selectedIndexes.length; i++) {
      const cert = filteredCertificates[selectedIndexes[i]];
      const percent = Math.round(((i + 1) / selectedIndexes.length) * 100);

      if (!cert.email) {
        showProgress(true, `מדלג על ${cert.firstName} ${cert.lastName} — אין מייל`, percent);
        continue;
      }

      showProgress(true, `מכין ושולח ל-${cert.firstName} ${cert.lastName} (${i + 1}/${selectedIndexes.length})...`, percent);

      try {
        const elem = buildCertificateElement(cert);
        document.getElementById('certificatesContainer').appendChild(elem);

        const opt = {
          margin: 0,
          filename: `Teuda_${cert.id}.pdf`,
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: { scale: 1.5, useCORS: true, backgroundColor: '#ffffff' },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        const pdfBase64 = await html2pdf().set(opt).from(elem).outputPdf('datauristring');
        elem.remove();

        const base64Data = pdfBase64.split(',')[1];
        const formData = new URLSearchParams();
        formData.append('action', 'sendBatchEmail');
        formData.append('email', cert.email.trim());
        formData.append('fullName', `${cert.firstName} ${cert.lastName}`);
        formData.append('pdfData', base64Data);
        formData.append('fileName', `Teuda_${cert.id}.pdf`);

        await postToAppsScript(formData);
      } catch (err) {
        console.error(`שגיאה בשליחת מייל ל-${cert.email}:`, err);
        showProgress(true, `שגיאה בשליחת מייל ל-${cert.firstName} ${cert.lastName}`, percent);
      }
    }

    showProgress(false);
    alert("פעולת שליחת המיילים הסתיימה.");
  }


  function postToAppsScript(formData) {
    return new Promise((resolve) => {
      const iframeName = 'gasPostFrame_' + Date.now();

      const iframe = document.createElement('iframe');
      iframe.name = iframeName;
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = scriptURL;
      form.target = iframeName;
      form.style.display = 'none';

      for (const [key, value] of formData.entries()) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = value;
        form.appendChild(input);
      }

      document.body.appendChild(form);

      iframe.onload = function() {
        // אי אפשר לקרוא את תוכן ה-iframe בגלל same-origin policy,
        // אבל onload מאשר שהטופס נשלח לשרת.
        setTimeout(() => {
          form.remove();
          iframe.remove();
          resolve();
        }, 300);
      };

      form.submit();

      // fallback למקרה ש-onload לא מופעל.
      setTimeout(() => {
        if (document.body.contains(form)) form.remove();
        if (document.body.contains(iframe)) iframe.remove();
        resolve();
      }, 15000);
    });
  }

  function showProgress(show, statusText = '', percent = 0) {
    const container = document.getElementById('progressContainer');
    const textElem = document.getElementById('progressStatusText');
    const fillElem = document.getElementById('progressBarFill');

    container.style.display = show ? 'block' : 'none';
    textElem.textContent = statusText;
    fillElem.style.width = percent + '%';
  }

  window.addEventListener('load', loadData);
</script>

</body>
</html>
