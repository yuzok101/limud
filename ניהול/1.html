<style>
* {

.top-actions {

.stats-bar {

.stats-item span {

font-size: 22px;
font-weight: 800;
color: #00c8ff;
}

.controls {

grid-template-columns:
minmax(260px,2fr)
minmax(150px,.8fr)
auto auto auto auto auto auto;
gap: 9px;
align-items: center;

}

.search-input,
.select-input {
width: 100%;
padding: 11px 14px;
border-radius: 9px;
border: 1px solid #167bb0;

color: #fff;
outline: none;
}

.select-input:focus {

box-shadow: 0 0 0 2px rgba(0,200,255,.13);
}

.select-input option {
background: #0b2944;
color: #fff;
}

.btn {
padding: 11px 15px;
font-size: 14px;
font-weight: 800;
border: 0;
border-radius: 9px;
cursor: pointer;
transition: .18s ease;
white-space: nowrap;
}

.btn:hover {
transform: translateY(-1px);
filter: brightness(1.08);
}

.btn:active {
transform: translateY(0);
}

.btn-primary {

color: #fff;
}

.btn-success {
background: #20a44a;
color: #fff;
}

.btn-warning {
background: #ff9800;
color: #fff;
}

.btn-secondary {
background: #64748b;
color: #fff;
}

.btn-danger {
background: #dc3545;
color: #fff;
}

.btn-dark {

.progress-container {

overflow: auto;
border: 1px solid rgba(255,255,255,.10);

background: #0b2238;
}

table {

border-spacing: 0;

}

th,
td {

border-bottom: 1px solid rgba(255,255,255,.07);

}

th {

.modal-content {

/* =========================================================
תעודה
========================================================= */

.certificate-container {
position: relative;
width: 210mm;
height: 297mm;
flex: 0 0 auto;

background-image: url('certificate-template.jpg');

/*
הרקע מעט מוגדל ומוזז למעלה כדי למנוע פס לבן
*/

background-position: center -1.2mm;

background-color: #fff;

page-break-after: always;
overflow: hidden;
}

/*
=========================================================
שם פרטי + שם משפחה
=========================================================
הועלה מעט למעלה כדי להיות ממש מעל הקו.
בנוסף יש רווח גדול וברור יותר בין השם הפרטי למשפחה.
*/

.field-name {
position: absolute;

top: 34.9%;

left: 14%;
right: 14%;

display: flex;
justify-content: center;
align-items: center;

gap: 24px;

text-align: center;

font-size: 31px;
font-weight: 800;

color: #172c72;

line-height: 1;

direction: rtl;

white-space: nowrap;
}

.field-name span {
display: inline-block;
}

/*
=========================================================
מספר תעודת זהות
=========================================================
המספר עולה מעט למעלה ונצמד לקצה השמאלי
של השורה.
*/

.field-id {
position: absolute;

top: 46.7%;

left: 20%;
right: 20%;

text-align: left;

font-size: 22px;
font-weight: 700;

color: #1d2d54;

direction: ltr;

line-height: 1;

white-space: nowrap;
}

/*
=========================================================
הכשרה
=========================================================
עולה למעלה כדי להיות ממש מתחת ל:
"עבר/ה בהצלחה קורס:"
*/

.field-course {
position: absolute;

top: 53.9%;

left: 16%;
right: 16%;

text-align: center;

font-size: 27px;
font-weight: 800;

color: #172c72;

line-height: 1;

direction: rtl;

white-space: nowrap;
}

/*
=========================================================
היקף שעות
=========================================================
עולה ומוצמד לקצה השמאלי של השורה.
*/

.field-hours {
position: absolute;

top: 58.3%;

left: 20%;
right: 20%;

text-align: left;

font-size: 21px;
font-weight: 700;

color: #1d2d54;

direction: rtl;

line-height: 1;

white-space: nowrap;
}

/*
=========================================================
תאריך הנפקה
=========================================================
עולה ומוצמד לקצה השמאלי של השורה.
*/

.field-date {
position: absolute;

top: 63.3%;

left: 20%;
right: 20%;

text-align: left;

font-size: 21px;
font-weight: 700;

direction: ltr;

line-height: 1;

white-space: nowrap;

}

<div id="loadingOverlay" class="loading-overlay">

<div class="loading-subtext">אנא המתן בזמן טעינת ה-תעודות</div>
</div>
</div>

<div class="app-shell">

<script>

const scriptURL =
'https://script.google.com/macros/s/AKfycbwLkr494xjIbksbfRjaQg7CumbXTaLoln23hWySS5JSO_YrDj5lATNNdPXrcB9aKN17/exec';

let allCertificates = [];
let filteredCertificates = [];
let dataCache = null;
let cacheTime = 0;
const CACHE_DURATION = 5 * 60 * 1000; // 5 דקות cache

/*
=========================================================
טעינת נתונים עם שיפור ביצועים
=========================================================
*/

function loadData() {

// בדוק אם יש cache תקף
if (dataCache && (Date.now() - cacheTime < CACHE_DURATION)) {
console.log('שימוש ב-cache');
processData(dataCache);
return;
}

const loadingOverlay = document.getElementById('loadingOverlay');
loadingOverlay.style.display = 'flex';

const callbackName =
'certificatesCallback_' + Date.now();

window[callbackName] = function(data) {

try {

console.log(
'Google Apps Script response:',
data
);

if (!data || !data.success) {

alert(
'שגיאה בטעינת הנתונים: ' +
(
data && data.message
? data.message
: 'שגיאה לא ידועה'
)
);

loadingOverlay.style.display = 'none';
return;
}

// שמור cache
dataCache = data;
cacheTime = Date.now();

processData(data);

} catch (e) {

console.error(
'שגיאה בעיבוד הנתונים:',
e
);

alert(
'שגיאה בעיבוד הנתונים'
);

loadingOverlay.style.display = 'none';

} finally {

delete window[callbackName];

const oldScript =
document.getElementById(callbackName);

if (oldScript) {
oldScript.remove();
}

}

};

const script =
document.createElement('script');

script.id = callbackName;

script.src =
scriptURL +
'?action=getAllCertificates' +
'&callback=' +
encodeURIComponent(callbackName) +
'&t=' +
Date.now();

script.onerror = function() {

console.error(
'Google Apps Script JSONP request failed'
);

alert(
'שגיאה בחיבור ל-Google Apps Script'
);

delete window[callbackName];
loadingOverlay.style.display = 'none';
script.remove();

};

document.body.appendChild(script);

}

function processData(data) {
allCertificates =
Array.isArray(data.certificates)
? data.certificates
: [];

filteredCertificates =
[...allCertificates];

renderTable();

const loadingOverlay = document.getElementById('loadingOverlay');
loadingOverlay.style.display = 'none';
}

/*
=========================================================
אבטחת HTML
=========================================================
*/

function escapeHtml(value) {

return String(value ?? '').replace(
/[&<>"']/g,
ch => ({
'&': '&amp;',
'<': '&lt;',
'>': '&gt;',
'"': '&quot;',
"'": '&#039;'
}[ch])
);

}


/*
=========================================================
טבלה
=========================================================
*/

function renderTable() {

const tbody =
document.getElementById(
'certificatesTableBody'
);


if (filteredCertificates.length === 0) {

tbody.innerHTML =
'<tr>' +
'<td colspan="7" style="text-align:center;padding:30px;">' +
'לא נמצאו רשומות מתאימות' +
'</td>' +
'</tr>';

updateStats();

return;
}


tbody.innerHTML =
filteredCertificates.map(
(cert, index) => `

<tr>

<td>
<input
type="checkbox"
class="cert-checkbox"
data-index="${index}"
onchange="updateStats()"
>
</td>

<td dir="ltr">
${escapeHtml(cert.id)}
</td>

<td>
<strong>
${escapeHtml(cert.firstName)}
${escapeHtml(cert.lastName)}
</strong>
</td>

<td class="course-cell">
${escapeHtml(
cert.courseName || '—'
)}
</td>

<td class="training-cell">
${escapeHtml(
cert.training || '—'
)}
</td>

<td>
${escapeHtml(
cert.courseEnd || '—'
)}
</td>

<td>
${
cert.email
? `
<span class="email-ok">
${escapeHtml(cert.email)}
</span>
`
: `
<span class="email-no">
ללא מייל
</span>
`
}
</td>

</tr>

`
).join('');


document.getElementById(
'selectAll'
).checked = false;

updateStats();

}


/*
=========================================================
חיפוש וסינון
=========================================================
*/

function filterCertificates() {

const query =
document.getElementById(
'searchInput'
).value.trim().toLowerCase();

const emailFilter =
document.getElementById(
'emailFilter'
).value;


filteredCertificates =
allCertificates.filter(c => {

const fullText = [

c.id,
c.firstName,
c.lastName,
c.training,
c.courseName,
c.courseEnd,
c.email
].join(' ').toLowerCase();


if (query && !fullText.includes(query)) {
return false;
}

if (emailFilter === 'hasEmail') {
return !!c.email;
}

if (emailFilter === 'noEmail') {
return !c.email;
}

return true;

});


renderTable();

}


/*
=========================================================
עדכון סטטיסטיקה
=========================================================
*/

function updateStats() {

document.getElementById('statTotal').textContent =
allCertificates.length;

document.getElementById('statFiltered').textContent =
filteredCertificates.length;

const checked =
document.querySelectorAll(
'.cert-checkbox:checked'
).length;

document.getElementById('statSelected').textContent =
checked;

const withEmail =
allCertificates.filter(
c => c.email
).length;

document.getElementById('statWithEmail').textContent =
withEmail;

document.getElementById('selectedCountDisplay').textContent =
checked;

}


/*
=========================================================
בחירה
=========================================================
*/

function toggleSelectAll(checkbox) {

document.querySelectorAll('.cert-checkbox').forEach(
cb => {
cb.checked = checkbox.checked;
}
);

updateStats();

}


function clearSelection() {

document.querySelectorAll('.cert-checkbox').forEach(
cb => {
cb.checked = false;
}
);

document.getElementById('selectAll').checked = false;
updateStats();

}


function getSelectedCertificates() {

const selected = [];

document.querySelectorAll('.cert-checkbox').forEach(cb => {

if (cb.checked) {

const index = parseInt(
cb.getAttribute('data-index')
);

if (index >= 0 && index < filteredCertificates.length) {
selected.push(filteredCertificates[index]);
}

}

});

return selected;

}


/*
=========================================================
תצוגה ועריכה
=========================================================
*/

function renderSelectedCertificates() {

const selected = getSelectedCertificates();

if (selected.length === 0) {
alert('בחר תעודות להצגה');
return;
}

const container =
document.getElementById(
'certificatesContainer'
);

container.innerHTML =
selected.map(cert => `

<div class="certificate-container">

<div class="field-name">
<span>${escapeHtml(cert.firstName)}</span>
<span>${escapeHtml(cert.lastName)}</span>
</div>

<div class="field-id">
${escapeHtml(cert.id)}
</div>

<div class="field-course">
${escapeHtml(cert.courseName || '—')}
</div>

<div class="field-hours">
${escapeHtml(cert.training || '—')}
</div>

<div class="field-date">
${escapeHtml(cert.courseEnd || '—')}
</div>

<div class="certificate-label">
מספר תעודה: ${escapeHtml(cert.id)}
</div>

</div>

`
).join('');

window.scrollTo(0, 0);

}


/*
=========================================================
הורדה
=========================================================
*/

function downloadSelectedPDFs() {

const selected = getSelectedCertificates();

if (selected.length === 0) {
alert('בחר תעודות להורדה');
return;
}

showProgress();

let processed = 0;

selected.forEach((cert, idx) => {

setTimeout(() => {

const element = createCertificateElement(cert);

const opt = {
margin: 0,
filename: `${cert.firstName}_${cert.lastName}_certificate.pdf`,
image: { type: 'png', quality: 0.98 },
html2canvas: { scale: 2 },
jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
};

html2pdf().set(opt).from(element).save().then(() => {
processed++;
updateProgressBar(processed, selected.length);
if (processed === selected.length) {
hideProgress();
}
});

}, idx * 500);

});

}


function downloadSelectedZip() {

const selected = getSelectedCertificates();

if (selected.length === 0) {
alert('בחר תעודות להורדה');
return;
}

showProgress();
const zip = new JSZip();
let processed = 0;

selected.forEach((cert, idx) => {

setTimeout(() => {

const element = createCertificateElement(cert);

const opt = {
margin: 0,
image: { type: 'png', quality: 0.98 },
html2canvas: { scale: 2 },
jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
};

html2pdf().set(opt).from(element).outputPdf('blob').then(blob => {

const filename =
`${cert.firstName}_${cert.lastName}_certificate.pdf`;

zip.file(filename, blob);

processed++;
updateProgressBar(processed, selected.length);

if (processed === selected.length) {

zip.generateAsync({ type: 'blob' }).then(blob => {
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = 'certificates.zip';
a.click();
URL.revokeObjectURL(url);
hideProgress();
});

}

});

}, idx * 500);

});

}


function createCertificateElement(cert) {

const div = document.createElement('div');

div.className = 'certificate-container';

div.innerHTML = `

<div class="field-name">
<span>${escapeHtml(cert.firstName)}</span>
<span>${escapeHtml(cert.lastName)}</span>
</div>

<div class="field-id">
${escapeHtml(cert.id)}
</div>

<div class="field-course">
${escapeHtml(cert.courseName || '—')}
</div>

<div class="field-hours">
${escapeHtml(cert.training || '—')}
</div>

<div class="field-date">
${escapeHtml(cert.courseEnd || '—')}
</div>

`;

return div;

}


/*
=========================================================
שליחה במייל
=========================================================
*/

function sendSelectedEmails() {

const selected = getSelectedCertificates();

if (selected.length === 0) {
alert('בחר תעודות לשליחה');
return;
}

const emails = selected
.filter(c => c.email)
.map(c => c.email);

if (emails.length === 0) {
alert('לא נבחרו תעודות עם כתובות מייל');
return;
}

showProgress();

const callbackName =
'sendEmailCallback_' + Date.now();

window[callbackName] = function(response) {

delete window[callbackName];

const oldScript =
document.getElementById(callbackName);

if (oldScript) {
oldScript.remove();
}

hideProgress();

if (response && response.success) {
alert(`נשלחו ${response.count || 0} מייל/ים בהצלחה`);
} else {
alert('שגיאה בשליחת המייל');
}

};

const script = document.createElement('script');
script.id = callbackName;

script.src =
scriptURL +
'?action=sendEmails' +
'&emails=' +
encodeURIComponent(JSON.stringify(emails)) +
'&callback=' +
encodeURIComponent(callbackName) +
'&t=' +
Date.now();

script.onerror = function() {
alert('שגיאה בשליחת המייל');
delete window[callbackName];
hideProgress();
script.remove();
};

document.body.appendChild(script);

}

/*
=========================================================
שליחה לכתובת מייל אחת
=========================================================
*/

function openSendToEmailModal() {

const selected = getSelectedCertificates();

if (selected.length === 0) {
alert('בחר תעודות לשליחה');
return;
}

document.getElementById('sendToEmailModal').style.display = 'block';
document.getElementById('recipientEmail').value = '';
document.getElementById('selectedCountDisplay').textContent = selected.length;

}

function closeSendToEmailModal() {
document.getElementById('sendToEmailModal').style.display = 'none';
}

function sendToSingleEmail() {

const selected = getSelectedCertificates();

if (selected.length === 0) {
alert('בחר תעודות לשליחה');
return;
}

const recipientEmail = document.getElementById('recipientEmail').value.trim();
const emailSubject = document.getElementById('emailSubject').value.trim();

if (!recipientEmail) {
alert('אנא הזן כתובת מייל');
return;
}

if (!validateEmail(recipientEmail)) {
alert('כתובת המייל אינה תקינה');
return;
}

showProgress();

const callbackName =
'sendToEmailCallback_' + Date.now();

window[callbackName] = function(response) {

delete window[callbackName];

const oldScript =
document.getElementById(callbackName);

if (oldScript) {
oldScript.remove();
}

hideProgress();
closeSendToEmailModal();

if (response && response.success) {
alert(`נשלחו ${selected.length} תעודות ל-${recipientEmail} בהצלחה`);
clearSelection();
} else {
alert('שגיאה בשליחת המייל: ' + (response?.message || 'שגיאה לא ידועה'));
}

};

const script = document.createElement('script');
script.id = callbackName;

script.src =
scriptURL +
'?action=sendToSingleEmail' +
'&recipientEmail=' +
encodeURIComponent(recipientEmail) +
'&subject=' +
encodeURIComponent(emailSubject) +
'&certificateIds=' +
encodeURIComponent(JSON.stringify(selected.map(c => c.id))) +
'&callback=' +
encodeURIComponent(callbackName) +
'&t=' +
Date.now();

script.onerror = function() {
alert('שגיאה בשליחת המייל');
delete window[callbackName];
hideProgress();
script.remove();
};

document.body.appendChild(script);

}

function validateEmail(email) {
const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
return re.test(email);
}

/*
=========================================================
עמודת התקדמות
=========================================================
*/

function showProgress() {
document.getElementById('progressContainer').style.display = 'block';
document.getElementById('progressBarFill').style.width = '0%';
}

function hideProgress() {
document.getElementById('progressContainer').style.display = 'none';
}

function updateProgressBar(current, total) {
const percent = Math.round((current / total) * 100);
document.getElementById('progressBarFill').style.width = percent + '%';
document.getElementById('progressStatusText').textContent =
`מעבד... ${current} מתוך ${total}`;
}

/*
=========================================================
טעינה בהתחלה
=========================================================
*/

window.addEventListener('DOMContentLoaded', function() {
loadData();
});

</script>
