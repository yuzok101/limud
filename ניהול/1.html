<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול והנפקת תעודות מרוכזת - יוזוק מדיק</title>

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Assistant', sans-serif;
}

html, body {
min-height: 100%;
}

body {
background: #071522;
color: #fff;
min-height: 100vh;
padding: 0;
overflow-x: hidden;
}

button, input, select {
font: inherit;
}

.app-shell {
width: 100%;
min-height: 100vh;
}

.admin-panel {
width: 100%;
max-width: none;
margin: 0;
padding: 18px clamp(14px, 2vw, 30px) 24px;
background: linear-gradient(180deg, #102d4a 0%, #0b2238 100%);
border-radius: 0;
box-shadow: 0 8px 35px rgba(0,0,0,.38);
}

.topbar {
display: flex;
align-items: center;
justify-content: space-between;
gap: 15px;
margin-bottom: 16px;
}

h1 {
color: #ffd700;
font-weight: 800;
font-size: clamp(22px,2.2vw,34px);
}

.sub-title {
color: #b8d8ef;
font-size: 14px;
margin-top: 3px;
}

.top-actions {
display: flex;
gap: 8px;
flex-wrap: wrap;
justify-content: flex-end;
}

.stats-bar {
display: grid;
grid-template-columns: repeat(4,minmax(0,1fr));
gap: 10px;
background: rgba(255,255,255,.045);
padding: 10px;
border-radius: 12px;
margin-bottom: 12px;
border: 1px solid rgba(255,255,255,.09);
}

.stats-item {
padding: 10px 12px;
border-radius: 9px;
background: rgba(255,255,255,.04);
color: #dbeeff;
text-align: center;
font-size: 14px;
}

.stats-item span {
display: block;
font-size: 22px;
font-weight: 800;
color: #00c8ff;
}

.controls {
display: grid;
grid-template-columns:
minmax(260px,2fr)
minmax(150px,.8fr)
auto auto auto auto auto;
gap: 9px;
align-items: center;
margin-bottom: 12px;
}

.search-input,
.select-input {
width: 100%;
padding: 11px 14px;
border-radius: 9px;
border: 1px solid #167bb0;
background: #0b2944;
color: #fff;
outline: none;
}

.search-input:focus,
.select-input:focus {
border-color: #00c8ff;
box-shadow: 0 0 0 2px rgba(0,200,255,.13);
}

.select-input option {
background: #0b2944;
color: #fff;
}

.btn {
padding: 11px 15px;
font-size: 14px;
font-weight: 800;
border: 0;
border-radius: 9px;
cursor: pointer;
transition: .18s ease;
white-space: nowrap;
}

.btn:hover {
transform: translateY(-1px);
filter: brightness(1.08);
}

.btn:active {
transform: translateY(0);
}

.btn-primary {
background: #00aeea;
color: #fff;
}

.btn-success {
background: #20a44a;
color: #fff;
}

.btn-warning {
background: #ff9800;
color: #fff;
}

.btn-secondary {
background: #64748b;
color: #fff;
}

.btn-danger {
background: #dc3545;
color: #fff;
}

.btn-dark {
background: #1e3a56;
color: #fff;
border: 1px solid #315675;
}

.progress-container {
display: none;
margin-bottom: 12px;
background: rgba(255,255,255,.07);
border-radius: 9px;
padding: 9px 12px;
border: 1px solid rgba(255,255,255,.08);
}

.progress-bar-bg {
background: #071a2a;
height: 10px;
border-radius: 6px;
overflow: hidden;
margin-top: 6px;
}

.progress-bar-fill {
height: 100%;
width: 0;
background: #00c8ff;
transition: width .2s ease;
}

.table-container {
height: calc(100vh - 300px);
min-height: 330px;
overflow: auto;
border: 1px solid rgba(255,255,255,.10);
border-radius: 10px;
background: #0b2238;
}

table {
width: 100%;
border-collapse: separate;
border-spacing: 0;
text-align: right;
}

th,
td {
padding: 10px 12px;
border-bottom: 1px solid rgba(255,255,255,.07);
font-size: 14px;
}

th {
background: #102f4d;
color: #00c8ff;
position: sticky;
top: 0;
z-index: 2;
}

tbody tr:hover {
background: rgba(0,191,255,.055);
}

td:nth-child(1),
th:nth-child(1) {
width: 44px;
text-align: center;
}

.course-cell {
font-weight: 700;
color: #f5fbff;
}

.training-cell {
color: #bfe7ff;
}

.email-ok {
color: #32d46a;
}

.email-no {
color: #ff6b6b;
}

#certificatesContainer {
display: flex;
flex-direction: column;
align-items: center;
gap: 24px;
margin: 0;
padding: 28px 12px;
background: #071522;
}

.certificate-container {
position: relative;
width: 210mm;
height: 297mm;
flex: 0 0 auto;

background-image: url('certificate-template.jpg');

background-size: 100.5% 100.5%;
background-position: center -1.2mm;
background-repeat: no-repeat;
background-color: #fff;

box-sizing: border-box;
page-break-after: always;
overflow: hidden;
}

.field-name {
position: absolute;

top: 34.9%;

left: 14%;
right: 14%;

display: flex;
justify-content: center;
align-items: center;

gap: 24px;

text-align: center;

font-size: 31px;
font-weight: 800;

color: #172c72;

line-height: 1;

direction: rtl;

white-space: nowrap;
}

.field-name span {
display: inline-block;
}

.field-id {
position: absolute;

top: 46.7%;

left: 20%;
right: 20%;

text-align: left;

font-size: 22px;
font-weight: 700;

color: #1d2d54;

direction: ltr;

line-height: 1;

white-space: nowrap;
}

.field-course {
position: absolute;

top: 53.9%;

left: 16%;
right: 16%;

text-align: center;

font-size: 27px;
font-weight: 800;

color: #172c72;

line-height: 1;

direction: rtl;

white-space: nowrap;
}

.field-hours {
position: absolute;

top: 58.3%;

left: 20%;
right: 20%;

text-align: left;

font-size: 21px;
font-weight: 700;

color: #1d2d54;

direction: rtl;

line-height: 1;

white-space: nowrap;
}

.field-date {
position: absolute;

top: 63.3%;

left: 20%;
right: 20%;

text-align: left;

font-size: 21px;
font-weight: 700;

color: #1d2d54;

direction: ltr;

line-height: 1;

white-space: nowrap;
}

.certificate-label {
position: absolute;
top: 91.8%;
left: 6%;
right: 6%;

text-align: center;

color: #fff;
font-size: 10px;
opacity: .8;
}

.import-section {
margin-bottom: 12px;
padding: 12px;
background: rgba(255,255,255,.07);
border-radius: 9px;
border: 1px solid rgba(255,255,255,.08);
}

.import-section label {
display: block;
font-size: 13px;
margin-bottom: 8px;
color: #b8d8ef;
}

.import-section input[type="file"] {
padding: 8px;
background: #0b2944;
border: 1px solid #167bb0;
border-radius: 6px;
color: #fff;
width: 100%;
}

@media (max-width: 1200px) {
.controls {
grid-template-columns: 1fr 180px repeat(3,auto);
}

.controls .btn:nth-of-type(4),
.controls .btn:nth-of-type(5) {
grid-row: 2;
}
}

@media (max-width: 800px) {
.stats-bar {
grid-template-columns: repeat(2,1fr);
}

.controls {
grid-template-columns: 1fr 1fr;
}

.controls .search-input {
grid-column: 1/-1;
}

.table-container {
height: 55vh;
}

.topbar {
flex-direction: column;
align-items: stretch;
}

.top-actions {
justify-content: flex-start;
}
}

@media print {
body {
background: #fff !important;
padding: 0 !important;
}

.admin-panel {
display: none !important;
}

#certificatesContainer {
margin: 0 !important;
padding: 0 !important;
gap: 0 !important;
}

.certificate-container {
box-shadow: none !important;
border-radius: 0 !important;
width: 210mm !important;
height: 297mm !important;
page-break-after: always !important;
}

@page {
size: A4 portrait;
margin: 0 !important;
}
}
</style>
</head>

<body>

<div class="app-shell">

<div class="admin-panel">

<div class="topbar">

<div>
<h1>פאנל מנהל — הנפקה וניהול תעודות</h1>
<div class="sub-title">
ניהול, חיפוש, הנפקה, הורדה ושליחה מרוכזת (בלי API)
</div>
</div>

<div class="top-actions">
<button class="btn btn-dark" onclick="loadData()">
🔄 רענן נתונים
</button>

<button class="btn btn-dark" onclick="clearSelection()">
✕ נקה בחירה
</button>
</div>

</div>

<div class="import-section">
<label for="jsonFileInput">📤 טען קובץ JSON:</label>
<input
type="file"
id="jsonFileInput"
accept=".json"
onchange="handleJsonUpload(event)"
>
<div style="font-size: 12px; color: #8ab4d5; margin-top: 6px;">
הנתונים יישמרו בהתקן (localStorage)
</div>
</div>

<div class="stats-bar">

<div class="stats-item">
סה"כ רשומות
<span id="statTotal">0</span>
</div>

<div class="stats-item">
רשומות מוצגות
<span id="statFiltered">0</span>
</div>

<div class="stats-item">
נבחרו
<span id="statSelected">0</span>
</div>

<div class="stats-item">
עם מייל
<span id="statWithEmail">0</span>
</div>

</div>

<div class="controls">

<input
type="text"
id="searchInput"
class="search-input"
placeholder="חפש לפי ת.ז, שם, קורס, הכשרה או מייל..."
oninput="filterCertificates()"
>

<select
id="emailFilter"
class="select-input"
onchange="filterCertificates()"
>
<option value="all">כל הרשומות</option>
<option value="hasEmail">עם מייל בלבד</option>
<option value="noEmail">ללא מייל</option>
</select>

<button
class="btn btn-primary"
onclick="renderSelectedCertificates()"
>
👁️ תצוגה
</button>

<button
class="btn btn-warning"
onclick="downloadSelectedPDFs()"
>
⬇️ הורד PDF
</button>

<button
class="btn btn-warning"
onclick="downloadSelectedZip()"
>
📦 הורד ZIP
</button>

<button
class="btn btn-secondary"
onclick="downloadJSON()"
>
💾 שמור JSON
</button>

<button
class="btn btn-secondary"
onclick="window.print()"
>
🖨️ הדפס
</button>

</div>

<div
class="progress-container"
id="progressContainer"
>

<div
id="progressStatusText"
style="font-size:14px;color:#00c8ff;"
>
מעבד...
</div>

<div class="progress-bar-bg">
<div
id="progressBarFill"
class="progress-bar-fill"
></div>
</div>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>
<input
type="checkbox"
id="selectAll"
onclick="toggleSelectAll(this)"
title="בחר הכל"
>
</th>

<th>ת.ז</th>
<th>שם מלא</th>
<th>קורס</th>
<th>הכשרה</th>
<th>תאריך סיום</th>
<th>מייל</th>

</tr>

</thead>

<tbody id="certificatesTableBody">

<tr>
<td
colspan="7"
style="text-align:center;"
>
טוען נתונים...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>


<div id="certificatesContainer"></div>


<script>

let allCertificates = [];
let filteredCertificates = [];

// =========================================================
// שמירה וטעינה מ-localStorage
// =========================================================

function saveCertificatesToStorage() {
try {
localStorage.setItem('certificates', JSON.stringify(allCertificates));
console.log('✓ נתונים נשמרו בהתקן');
} catch (e) {
console.error('שגיאה בשמירה:', e);
}
}

function loadCertificatesFromStorage() {
try {
const stored = localStorage.getItem('certificates');
if (stored) {
allCertificates = JSON.parse(stored);
console.log('✓ נתונים נטענו מהתקן:', allCertificates.length);
} else {
allCertificates = [];
console.log('אין נתונים בהתקן');
}
} catch (e) {
console.error('שגיאה בטעינה:', e);
allCertificates = [];
}
}

// =========================================================
// ייבוא JSON מקובץ
// =========================================================

function handleJsonUpload(event) {
const file = event.target.files[0];
if (!file) return;

const reader = new FileReader();
reader.onload = function(e) {
try {
const data = JSON.parse(e.target.result);
const certificates = Array.isArray(data) ? data : (data.certificates || []);

if (certificates.length === 0) {
alert('הקובץ לא מכיל נתונים');
return;
}

allCertificates = certificates;
saveCertificatesToStorage();
filteredCertificates = [...allCertificates];
renderTable();
alert(`✓ נטענו ${certificates.length} תעודות בהצלחה!`);

} catch (err) {
alert('שגיאה בקריאת הקובץ: ' + err.message);
}
};
reader.readAsText(file);
}

// =========================================================
// ייצוא JSON לקובץ
// =========================================================

function downloadJSON() {
const dataStr = JSON.stringify(allCertificates, null, 2);
const dataBlob = new Blob([dataStr], { type: 'application/json' });
const url = URL.createObjectURL(dataBlob);
const link = document.createElement('a');
link.href = url;
link.download = 'certificates_' + new Date().toISOString().slice(0, 10) + '.json';
link.click();
URL.revokeObjectURL(url);
}

// =========================================================
// טעינת נתונים בעת טעינת העמוד
// =========================================================

function loadData() {
loadCertificatesFromStorage();
filteredCertificates = [...allCertificates];
renderTable();
if (allCertificates.length === 0) {
alert('לא נמצאו נתונים בהתקן. אנא טען קובץ JSON.');
}
}

// =========================================================
// אבטחת HTML
// =========================================================

function escapeHtml(value) {
return String(value ?? '').replace(
/[&<>"']/g,
ch => ({
'&': '&amp;',
'<': '&lt;',
'>': '&gt;',
'"': '&quot;',
"'": '&#039;'
}[ch])
);
}

// =========================================================
// טבלה
// =========================================================

function renderTable() {
const tbody = document.getElementById('certificatesTableBody');

if (filteredCertificates.length === 0) {
tbody.innerHTML =
'<tr>' +
'<td colspan="7" style="text-align:center;padding:30px;">' +
'לא נמצאו רשומות מתאימות' +
'</td>' +
'</tr>';

updateStats();
return;
}

tbody.innerHTML = filteredCertificates.map(
(cert, index) => `

<tr>

<td>
<input
type="checkbox"
class="cert-checkbox"
data-index="${index}"
onchange="updateStats()"
>
</td>

<td dir="ltr">
${escapeHtml(cert.id)}
</td>

<td>
<strong>
${escapeHtml(cert.firstName)}
${escapeHtml(cert.lastName)}
</strong>
</td>

<td class="course-cell">
${escapeHtml(cert.courseName || '—')}
</td>

<td class="training-cell">
${escapeHtml(cert.training || '—')}
</td>

<td>
${escapeHtml(cert.courseEnd || '—')}
</td>

<td>
${
cert.email
? `<span class="email-ok">${escapeHtml(cert.email)}</span>`
: `<span class="email-no">ללא מייל</span>`
}
</td>

</tr>

`
).join('');

document.getElementById('selectAll').checked = false;
updateStats();
}

// =========================================================
// חיפוש וסינון
// =========================================================

function filterCertificates() {
const query = document.getElementById('searchInput').value.trim().toLowerCase();
const emailFilter = document.getElementById('emailFilter').value;

filteredCertificates = allCertificates.filter(c => {
const fullText = [
c.id,
c.firstName,
c.lastName,
c.training,
c.courseName,
c.courseEnd,
c.email
].join(' ').toLowerCase();

const matchesSearch = fullText.includes(query);
const matchesEmail =
emailFilter === 'all' ||
(emailFilter === 'hasEmail' && c.email) ||
(emailFilter === 'noEmail' && !c.email);

return matchesSearch && matchesEmail;
});

renderTable();
}

// =========================================================
// סטטיסטיקות
// =========================================================

function updateStats() {
const total = allCertificates.length;
const filtered = filteredCertificates.length;
const selected = document.querySelectorAll('.cert-checkbox:checked').length;
const withEmail = allCertificates.filter(c => c.email).length;

document.getElementById('statTotal').textContent = total;
document.getElementById('statFiltered').textContent = filtered;
document.getElementById('statSelected').textContent = selected;
document.getElementById('statWithEmail').textContent = withEmail;
}

// =========================================================
// בחירה
// =========================================================

function toggleSelectAll(checkbox) {
document.querySelectorAll('.cert-checkbox').forEach(cb => {
cb.checked = checkbox.checked;
});
updateStats();
}

function clearSelection() {
document.querySelectorAll('.cert-checkbox').forEach(cb => {
cb.checked = false;
});
updateStats();
}

function getSelectedCertificates() {
const selected = [];
document.querySelectorAll('.cert-checkbox:checked').forEach(cb => {
const index = parseInt(cb.dataset.index);
selected.push(filteredCertificates[index]);
});
return selected;
}

// =========================================================
// הורדת PDF בודדים
// =========================================================

function downloadSelectedPDFs() {
const selected = getSelectedCertificates();
if (selected.length === 0) {
alert('אנא בחר לפחות תעודה אחת');
return;
}

showProgress(selected.length);

selected.forEach((cert, idx) => {
setTimeout(() => {
const cert_html = generateCertificateHTML(cert);
const opt = {
margin: 0,
filename: `${cert.lastName}_${cert.firstName}_certificate.pdf`,
image: { type: 'jpeg', quality: 0.98 },
html2canvas: { scale: 2 },
jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
};
html2pdf().set(opt).from(cert_html).save();
updateProgress(idx + 1, selected.length);
}, idx * 1000);
});
}

// =========================================================
// הורדת ZIP
// =========================================================

function downloadSelectedZip() {
const selected = getSelectedCertificates();
if (selected.length === 0) {
alert('אנא בחר לפחות תעודה אחת');
return;
}

showProgress(selected.length);
const zip = new JSZip();
let processed = 0;

selected.forEach((cert, idx) => {
setTimeout(() => {
const cert_html = generateCertificateHTML(cert);
const opt = {
margin: 0,
image: { type: 'jpeg', quality: 0.98 },
html2canvas: { scale: 2 },
jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
};

html2pdf().set(opt).from(cert_html).output('blob').then(pdfBlob => {
const filename = `${cert.lastName}_${cert.firstName}_certificate.pdf`;
zip.file(filename, pdfBlob);
processed++;
updateProgress(processed, selected.length);

if (processed === selected.length) {
zip.generateAsync({ type: 'blob' }).then(content => {
const url = URL.createObjectURL(content);
const link = document.createElement('a');
link.href = url;
link.download = 'certificates_' + new Date().toISOString().slice(0, 10) + '.zip';
link.click();
URL.revokeObjectURL(url);
hideProgress();
});
}
});
}, idx * 500);
});
}

// =========================================================
// תצוגת תעודות
// =========================================================

function renderSelectedCertificates() {
const selected = getSelectedCertificates();
if (selected.length === 0) {
alert('אנא בחר לפחות תעודה אחת');
return;
}

const container = document.getElementById('certificatesContainer');
container.innerHTML = selected.map(cert => generateCertificateHTML(cert)).join('');

window.scrollTo({ top: 0, behavior: 'smooth' });
}

// =========================================================
// יצירת HTML של תעודה
// =========================================================

function generateCertificateHTML(cert) {
return `
<div class="certificate-container">
<div class="field-name">
<span>${escapeHtml(cert.firstName)}</span>
<span>${escapeHtml(cert.lastName)}</span>
</div>
<div class="field-id">${escapeHtml(cert.id)}</div>
<div class="field-course">${escapeHtml(cert.courseName || '—')}</div>
<div class="field-hours">${escapeHtml(cert.training || '—')}</div>
<div class="field-date">${escapeHtml(cert.courseEnd || '—')}</div>
<div class="certificate-label">תעודת הנפקה</div>
</div>
`;
}

// =========================================================
// ניהול Progress Bar
// =========================================================

function showProgress(total) {
const container = document.getElementById('progressContainer');
container.style.display = 'block';
document.getElementById('progressBarFill').style.width = '0%';
}

function updateProgress(current, total) {
const percent = Math.round((current / total) * 100);
document.getElementById('progressStatusText').textContent = `מעבד: ${current}/${total}`;
document.getElementById('progressBarFill').style.width = percent + '%';
}

function hideProgress() {
setTimeout(() => {
document.getElementById('progressContainer').style.display = 'none';
}, 500);
}

// =========================================================
// טעינה בעת פתיחת העמוד
// =========================================================

document.addEventListener('DOMContentLoaded', () => {
loadData();
});

</script>

</body>
</html>
